name: CI
on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries (WebKitGTK, GTK, xdo)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: cargo build --locked
      - run: cargo test --locked
      - name: Bundle Valerie.app
        if: runner.os == 'macOS'
        run: ./scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Valerie.app
          path: target/Valerie.app
