# ==============================================================================================================
# Valerie settings: every option with its default.
#
# How this file works
#   - Your own file (~/.config/valerie/config.yaml) only needs the lines you want to change; anything missing
#     falls back to this file. Save it and Valerie updates instantly (no restart).
#   - Toggles are `true` / `false`. Options with a fixed set of choices list them as "one of: a | b | c".
#   - Lists (like `spaces`) replace the default list completely. Maps (like `keybindings`) merge key by key;
#     set a key to `null` to remove a default.
#   - Print this file any time with `valerie default-config`.
#   - Settings for one computer only go in this-mac.yaml next to config.yaml (same shape, any settings; it wins
#     over config.yaml and never syncs). Use it when one machine differs, e.g. `agents: { default: codex }` on a
#     Mac signed in to Codex but not Claude, or a different `downloads.folder`.
# ==============================================================================================================


# --------------------------------------------------------------------------------------------------------------
# General
# --------------------------------------------------------------------------------------------------------------

search_engine: "https://www.google.com/search?q=%s"   # %s is replaced by what you type
new_tab_url: ""            # page for a new tab; empty = open the command bar instead
user_agent: ""             # empty = Safari's user agent, so sites serve their full pages
editor: default            # what "Open Config File" opens your settings in. one of: default (the app your computer
                           # opens .yaml files with) | textedit | an app's name ("Visual Studio Code", Zed, Cursor,
                           # "Sublime Text") | a terminal editor (vim, nvim, nano, emacs, hx, micro), or any command
                           # written as "terminal: <command>", e.g. "terminal: nvim -O"
terminal: Terminal         # the app terminal editors open in. one of: Terminal | iTerm | Ghostty | WezTerm | kitty | Alacritty
language: ""               # the language of Valerie's own words, as a code like es, fr, de or ja. Valerie reads
                           # strings/<code>.yaml in this folder ("English words": "your words" for each thing it says;
                           # `valerie strings` lists them). empty = English


# --------------------------------------------------------------------------------------------------------------
# Look and layout
# --------------------------------------------------------------------------------------------------------------

layout:
  tab_bar: side            # where tabs live. one of: side | top
  sidebar_visible: true    # show the sidebar at launch (⌘S or `s` toggles it)
  sidebar_width: 248       # width of the full-size sidebar, pixels (drag the sidebar's edge to resize it live)
  sidebar_size: full       # one of: full (icon + title) | medium (icon + domain) | compact (icons only)
  sidebar_position: left   # one of: left | right
  reveal_sidebar_on_edge: true  # when the sidebar is hidden, moving the mouse to the window edge peeks it open
  bezel: 0                 # gap around the page in pixels. 0 = edge to edge like Safari, ~8 = Arc
  corner_radius: 16        # rounds the page where it meets the sidebar (every corner when bezel > 0); 0 = square
  split_gap: 2             # pixels between split-view panes
  split_focus: border      # how the focused split-view pane is shown. one of: border | dim (others fade) | both | none
  pinned_style: icons      # how pinned tabs look. one of: icons (Arc-style tiles) | list
  animation_ms: 180        # sidebar / space transition length, and the fade between spaces' themes; 0 = instant
  top_bar_height: 40       # height of the tab bar when tab_bar is top, pixels
  font: ""                 # font for Valerie's own sidebar, command bar and windows (a CSS font family, e.g.
                           # "Georgia" or "Comic Sans MS"); empty = the system font
  split_max_panes: 4       # most pages side by side in split view
  split_unfocused_opacity: 0.72   # how see-through the other panes get when split_focus is dim or both (0–1)
  split_border_width: 2    # thickness of the focused pane's border when split_focus is border or both, pixels

# Your own look for Valerie's windows: CSS files in the `ui` folder next to this file, applied after Valerie's own
# styles and updated the moment you save them:
#   ui/chrome.css   the sidebar, top tab bar and start page      ui/palette.css  the command bar
#   ui/chat.css     the Chats space                              ui/little.css   little windows' bar
#   ui/answer.css   answers under the find bar                   ui/welcome.css  the welcome guide
#   ui/plugins.css  the plugin marketplace
#   ui/page.css     what Valerie draws inside web pages (find bar, link hints, menus, toasts, reader view)
# The guide (`valerie llm-guide`) lists their class names and colour variables.
ui:
  custom_css: true         # use those files. true | false
window:
  remember: true           # reopen at the size and place you left it
  width: 0                 # size of the window the first time it opens, pixels; 0 = fill most of the screen
  height: 0
  screen_fraction: 0.92    # with width/height at 0: how much of the screen the window covers (0.5 – 1)
  min_width: 480           # the window can't be made smaller than this
  min_height: 360
  always_on_top: false     # keep Valerie above other apps' windows. true | false
  opacity: 1               # how solid the whole window is, 0.3 – 1 (below 1 you see what's behind it)
  vibrancy: none           # frosted glass behind the sidebar (macOS). one of: none | sidebar | window (the whole window)
  traffic_lights: auto     # the red / yellow / green window buttons. one of: auto (hidden while the sidebar is) | show | hide

toast_seconds: 1.8         # how long the little messages ("Copied URL", "Zoom 110%") stay up

# Each piece of text or chrome in the sidebar. Set to false to hide it.
sidebar:
  nav_buttons: true        # back / forward / reload buttons at the top
  url_bar: true            # the address pill (click it to edit the URL)
  url_path: false          # show the page's path after the domain (clicking the pill always shows the full URL)
  url_lock_icon: false     # a 🔒 before secure sites (insecure http:// sites are always marked)
  space_name: false        # the space's icon and name ("Personal", "School") above its pinned tabs
  favorites: false         # a row of favorite tiles shared by every space, above the pinned tabs. Off: one Pinned
                           # section per space (favorites you had become pinned tabs in the space you're in). true | false
  pinned_hint: true        # "Drag here to pin" when a space has no pinned tabs
  compact_pinned: folder   # pinned tabs in the icons-only sidebar. one of: folder (one icon; hover it to pick a tab) | icons (every tab shown)
  pinned_folder_icon: pin  # what that folder icon shows. one of: pin | star | favicons (the first four sites)
  kept_section: true       # the Kept list under the pinned icons: tabs that stay until you remove them (with folders)
  minus_for_saved_tabs: true   # pinned and kept tabs show − instead of ×: it closes the page but keeps the tab in the
                           # sidebar (× on a pinned tab does the same). false = × everywhere
  new_tab_button: false    # the "+ New Tab" row
  today_label: false       # the word "Today" on the divider above your tabs
  clear_button: hover      # "Clear" (archives today's tabs). one of: always | hover | never
  space_switcher: true     # the space icons at the bottom
  order: [url, favorites, widgets, space_name, pinned, kept, today, now_playing, spaces]
                           # top-to-bottom order of the sidebar's parts (widgets are plugins' buttons). space_name,
                           # pinned, kept and today scroll together. Parts left out keep their place at the end.
  tab_height: 38           # height of each tab in the list, in pixels (16 tiny … 120 huge); text and icons scale with it
  now_playing: true        # a mini player above the space icons for video/audio playing in another tab
  compact_width: 78        # sidebar width in its icons-only size, pixels (leave room for the window buttons)
  medium_width: 180        # sidebar width in its icon + domain size, pixels
  max_width: 520           # widest you can drag the sidebar, pixels
  pinned_columns: 4        # pinned icon tiles per row (full and medium sizes)
  pinned_tile_height: 46   # height of each pinned icon tile, pixels
  swipe_between_spaces: true   # two-finger swipe sideways on the sidebar switches spaces
  swipe_distance: 90       # how far your fingers move sideways to switch, pixels (smaller = quicker swipes count)
  preload_on_hover: true   # start loading a tab when the pointer rests on it in the sidebar, so clicking it is instant
  preload_delay_ms: 90     # how long the pointer rests before that, milliseconds
  preload_at_most: 3       # tabs kept loaded ahead like that at once; the oldest is let go when another starts
  double_click_edge: true  # double-clicking the sidebar's edge cycles full / medium / icons-only

start_page: logo           # what an empty space shows. one of: logo | wordmark | blank | plugin:<name> (that plugin's
                           # start.html, which can open sites and run the plugin's commands)
escape_hints: false        # "esc to close"-style reminders (Peek, vim insert mode). Valerie never shows a
                           # "press Esc to exit full screen" banner, whatever this is set to.
welcome: true              # the welcome guide (AI, sync, describe your browser, a tour) the first time Valerie opens;
                           # "Welcome Tour" in the command bar shows it again. true | false

command_bar:
  site_search: true        # type a site's name (e.g. "youtube"), press Tab, and search that site directly
  footer_hints: true       # the "↑↓ navigate  ↵ open …" row at the bottom
  empty_hint: false        # "Type to search tabs, history, bookmarks and commands" when nothing matches
  top_result: search       # what Enter picks while you type. one of: search (search/open what you typed; matching tabs
                           # and history are listed below it) | best_match (jump to a strongly matching tab instead)
  ask_agent_words: 6       # a request this many words long ("summarize the reviews on this page please") puts "Ask agent"
                           # at the top, as do questions ending in "?" two words shorter, and anything twice as long;
                           # 0 = never (it's still listed at the bottom)
  ask_agent_starts: [summarize, summarise, create, generate, write, draft, rewrite, explain, translate, compare,
                     analyze, analyse, research, brainstorm, outline, organize, organise, tidy]
                           # starting with one of these words puts "Ask agent" at the top, however short
                           # ("summarize this page", "create a packing list"); [] = only by length
  calculator: true         # math and unit conversions right in the command bar ("12*7", "5 km in mi", "70 f to c"); Enter copies
  width: 680               # command bar width, pixels
  top: 18                  # how far down the window it opens, percent of the window height
  font_size: 19            # size of the text you type, pixels (results scale with it)
  max_results: 60          # most results listed while typing
  dim_background: 0.22     # how much the page darkens behind the command bar (0 = not at all, 1 = black)
  result_weights:          # how strongly each kind of result ranks (higher = nearer the top)
    tab: 30
    favorite: 26
    pinned: 26
    plugin: 20
    command: 18
    space: 18
    bookmark: 12
    download: 10
    chat: 16
    setup: 6
    ai: 15
    watch: 5
    task: 17
    history: 8
    synced: 6
    theme: 5
    import: 5
    archived: 4
    password: 3
    agent: 2
    customize: 1


# Sites for Tab-to-search in the command bar. Type a keyword or the start of the name, press Tab, then your search.
#   url: the site's search address with %s where your search goes.   keywords: words that pick this site.
# Add one with a single entry in your config.yaml, e.g.
#   site_search:
#     Notion: { keywords: [notion], url: "https://www.notion.so/search?q=%s" }
# Remove a built-in one with `Reddit: null`.
site_search:
  ChatGPT: { keywords: [chatgpt, gpt], url: "https://chatgpt.com/?q=%s" }
  Claude: { keywords: [claude], url: "https://claude.ai/new?q=%s" }
  Perplexity: { keywords: [perplexity, pplx], url: "https://www.perplexity.ai/search?q=%s" }
  YouTube: { keywords: [youtube, yt], url: "https://www.youtube.com/results?search_query=%s" }
  Google: { keywords: [google], url: "https://www.google.com/search?q=%s" }
  Google Images: { keywords: [images, img], url: "https://www.google.com/search?tbm=isch&q=%s" }
  Google Maps: { keywords: [maps], url: "https://www.google.com/maps/search/%s" }
  DuckDuckGo: { keywords: [duckduckgo, ddg], url: "https://duckduckgo.com/?q=%s" }
  Wikipedia: { keywords: [wikipedia, wiki], url: "https://en.wikipedia.org/wiki/Special:Search?search=%s" }
  GitHub: { keywords: [github, gh], url: "https://github.com/search?q=%s" }
  Reddit: { keywords: [reddit], url: "https://www.reddit.com/search/?q=%s" }
  X: { keywords: [twitter], url: "https://x.com/search?q=%s" }
  Amazon: { keywords: [amazon], url: "https://www.amazon.com/s?k=%s" }
  Spotify: { keywords: [spotify], url: "https://open.spotify.com/search/%s" }
  Hacker News: { keywords: [hackernews, hn], url: "https://hn.algolia.com/?q=%s" }
  Stack Overflow: { keywords: [stackoverflow], url: "https://stackoverflow.com/search?q=%s" }
  MDN: { keywords: [mdn], url: "https://developer.mozilla.org/en-US/search?q=%s" }
  npm: { keywords: [npm], url: "https://www.npmjs.com/search?q=%s" }
  crates.io: { keywords: [crates], url: "https://crates.io/search?q=%s" }
  docs.rs: { keywords: [docsrs], url: "https://docs.rs/releases/search?query=%s" }

# Find in page (⌘F or `/`).
find:
  minimap: true            # a strip on the right showing the whole page, every match, and where you are
  highlight_all: true      # highlight every match, not just the current one
  highlight_color: "rgba(255,206,64,.55)"   # colour behind every match (any CSS colour)
  current_color: "#ff9632" # colour behind the match you're on


# --------------------------------------------------------------------------------------------------------------
# Tabs and windows
# --------------------------------------------------------------------------------------------------------------

tabs:
  archive_after_hours: 24  # Today tabs you haven't used for this long close (they're archived, searchable); 0 = never
  ask_to_keep_unused_days: 90   # ask whether to keep pinned, kept and favorite tabs you haven't opened in this many
                           # days (removed ones are archived, searchable); 0 = never ask
  unload_after_minutes: 60 # free the memory of tabs unused this long (they reload on click); 0 = never
  new_tab_position: top    # where new tabs appear in the list. one of: top | bottom
  autoplay_in_background: false   # let tabs opened in the background start playing video/audio before you look at them
  picture_in_picture_on_leave: true  # a video that's playing pops out into a floating window when you switch away from its tab
  zoom: site               # what ⌘+ / ⌘- zoom applies to. one of: site (every tab of that site, remembered) | tab (just this tab)
  default_zoom: 100        # zoom for every page you haven't zoomed yourself, percent (e.g. 125 for bigger text everywhere)
  zoom_step: 10            # how much each ⌘+ / ⌘- changes the zoom, percent
  zoom_min: 30             # smallest zoom, percent
  zoom_max: 300            # largest zoom, percent

# Peek (⌥⇧-click a link): a preview floating over the page.
peek:
  margin: 6                # space around the preview, percent of the window
  dim: 0.45                # how see-through the page behind gets (0 = invisible, 1 = not dimmed)
  corner_radius: 12        # rounding of the preview's corners, pixels

# What Valerie remembers.
history:
  max_pages: 5000          # pages kept in history (the command bar searches them)
  max_archived_tabs: 1000  # auto-archived tabs kept (searchable in the command bar)
  max_closed_tabs: 50      # closed tabs ⌘⇧T can bring back
  page:                    # the History page ("History" in the command bar). Your own pages/history.html in the
                           # config folder replaces it entirely
    group_by: day          # one of: day | site | none
    site_icons: true       # show each site's icon (loaded from the site). false = its first letter
    show_visits: true      # show how many times you've visited a page. true | false
    show_address: true     # show the page's address under its title. true | false

downloads:
  folder: ""               # where downloads and page captures go (e.g. "~/Desktop"); empty = your Downloads folder
  keep_in_list: 100        # finished downloads listed in the command bar
  ask: false               # ask where to save each download. true | false
  open_when_done: false    # open each file when it has finished downloading. true | false
  rules: []                # where files go by kind or by site; the first match wins, e.g.
  #  - { match: "*.pdf", folder: "~/Documents/PDFs", open: true }
  #  - { site: github.com, folder: "~/Code/downloads" }
  #  - { match: "*.{dmg,pkg}", ask: true }
  page:                    # the Downloads page ("Downloads" in the command bar). Your own pages/downloads.html in the
                           # config folder replaces it entirely
    group_by: day          # one of: day | site | type | none
    show_site: true        # show which site each file came from. true | false
    click_opens: file      # what clicking a download does. one of: file (open it) | folder (show it in its folder)

# Reader view (reader_view command, ⌘⇧R): the page's article as clean text.
reader_view:
  theme: auto              # one of: auto (follows your computer's light/dark mode) | light | dark | sepia
  font: serif              # one of: serif | sans
  font_size: 19            # text size in pixels
  width: 680               # column width in pixels

# The Chats space: conversations with your agents, to the left of your first space (⌘J opens it).
chats:
  enabled: true            # show the Chats space
  theme: black             # look of the Chats space: a theme name (black, midnight, ocean …) or "space" (the space you came from)
  access: full             # what a new chat's agent may do. one of: read (only look) | ask (you approve each action in
                           # the browser, and Claude's own tools) | full (no questions). Change it per chat in the composer.
  effort: ""               # reasoning effort for new chats. one of: "" (the CLI's default) | low | medium | high | max
  own_tools: true          # chat agents keep your own MCP servers, plugins and skills from that CLI, alongside Valerie's
  auto_settle_days: 3      # chats untouched this many days move to Settled (still there, out of the way); 0 = never
  closed_list: true        # a "Closed" fold at the bottom of the Chats sidebar with the chats you've closed; click one
                           # to bring it back. true | false
  from_space: float        # a chat started from a space (the command bar, an AI action, ⌘N). one of: float (it opens in
                           # the middle of the window, over your space; Esc sends it on to Chats and you keep working,
                           # Shift+Esc goes to Chats with it) | chats (switch to the Chats space)
  plan_button: false       # a "Plan" toggle in the composer: the agent proposes a plan and waits for you to say go
  composer_hint: false     # "↵ send · ⇧↵ new line" in the composer
  sync: true               # sync chats between machines (encrypted with the sync passphrase). false = this machine only
  ask_in_find: true        # in find (/), Enter on something that reads like a question asks the find agent about the page
  find_question_words: 4   # a find query this many words long (or ending in "?") counts as a question
  page_text_limit: 60000   # most characters of the page sent along with a question
  browser_context: true    # tell chat agents which tabs you have open (titles and addresses) so they can answer about them
  suggestions:             # ideas shown in an empty chat
    - "What's in my open tabs?"
    - "Summarize the page I'm on"
    - "Find the cheapest flight in my tabs"
    - "Merge my approved GitHub PRs once their checks pass"
  # Coding: give a chat a project folder (the folder button in the composer) and its agent works there like in a
  # terminal, with your browser to check what it builds. The folder is fixed once the chat starts.
  projects: []             # folders always offered in the composer's folder menu, besides ones you've used (e.g. ~/code/app)
  group_by_project: true   # in the Chats sidebar, chats with a project folder sit under that project's name
  steps: summary           # what the agent did while answering. one of: summary (finished work folds into "Worked 2m · 14 steps")
                           # | open (every step stays listed) | hidden (only the answer)
  usage: true              # under each answer: how long it took and how full the model's context is
  changes: true            # a card under a coding chat's answers listing the project's uncommitted changes, with their diffs
  change_actions:          # buttons on that card; each sends its prompt to the chat. Set one to null to remove it.
    Commit: "Commit the changes you made in this chat with a clear message."
    Commit and push: "Commit the changes you made in this chat with a clear message, then push."
    Open a pull request: "Put the changes from this chat on a new branch if it isn't on one of its own, commit them with a clear message, push, and open a pull request with gh. Give me its link."
    Merge back: "Commit the changes you made in this chat with a clear message. Then merge branch {branch} into {base} in the main checkout: git -C \"{folder}\" merge {branch}. If it conflicts, or the main checkout has uncommitted changes in the same files, stop and tell me."
                           # fill-ins: {folder} the project, {branch} the chat's own branch and {base} the branch it
                           # started from (buttons using {branch} or {base} only show for chats with their own worktree)
  worktrees: auto          # several chats on one project at once: each coding chat gets its own git worktree (a
                           # separate checkout on its own branch), so they don't edit the same files. one of: auto
                           # (a worktree, except in repos six-ten manages, which share one checkout on purpose) |
                           # always | never (every chat works in the project folder itself)
  worktree_folder: ""      # where those worktrees go (e.g. "~/worktrees"); empty = worktrees/ in Valerie's data folder
  worktree_copy: [.env, .env.local, .env.development.local]   # files git doesn't track that are copied from the project
                           # into each new worktree, so it runs like the original

# The terminal panel: shells at the bottom of the window, over pages and chats alike (Ctrl+' shows and hides it).
# In a coding chat it opens in that chat's project (its worktree, if it has one).
terminal_panel:
  enabled: true            # true | false
  shell: ""                # program to run, e.g. /bin/zsh or fish; empty = your login shell (PowerShell on Windows)
  folder: ""               # where a terminal opened outside a coding chat starts (e.g. ~/code); empty = your home folder
  height: 280              # panel height, pixels (drag its top edge to resize it)
  font: ""                 # a CSS font family, e.g. "JetBrains Mono"; empty = your system's monospace font
  font_size: 13            # text size, pixels
  line_height: 1.2         # space between lines (1 = tight)
  cursor: block            # one of: block | bar | underline
  cursor_blink: true       # true | false
  scrollback: 10000        # lines kept to scroll back through, per terminal
  copy_on_select: false    # selecting text copies it, like many Linux terminals. true | false
  follow_chat: true        # switching coding chats switches the panel to that chat's terminal. true | false
  ask_agent_button: true   # an "Ask Agent" button that sends the selection (or the last screen) to the open chat

# AI actions: one-click jobs for your agents. They show up in the command bar (type part of the name) and can go on a
# key: "CmdOrCtrl+Shift+S": { cmd: ai_action, name: "Summarize this page" }. Add your own; set one to null to remove it.
#   mode: page  — answered right under the find bar, from the page alone (the agent gets no tools)
#   mode: chat  — opens in Chats; the agent can see and use your whole browser
#   prompt: what to ask. Fill-ins: {title} {url} of the page you're on, {selection} the text you've selected,
#           {input} asks you for something first
#   agent: which agent (a name under agents.available); empty = agents.use.find for page, agents.use.chat for chat
ai_actions:
  Summarize this page: { mode: page, prompt: "Summarize this page in at most 5 short bullet points." }
  Explain the selection: { mode: page, prompt: "Explain this in plain words, using the page for context: {selection}" }
  Key facts and dates: { mode: page, prompt: "List the key facts, numbers, prices and dates on this page." }
  Ask about this page…: { mode: page, prompt: "{input}" }
  Triage my tabs: { mode: chat, prompt: "Go through all my open tabs in every space (list_tabs; read a page only when its title doesn't say enough). Sort them into: done with (close), duplicates (close), worth keeping (which Kept folder), still to do today (stay), and ones to rename. Show me that plan as a short list grouped by what you'd do, then wait: do it only when I say go, with any changes I ask for." }
  Tidy my tabs: { mode: chat, prompt: "Tidy my tabs in this space: close duplicates and pages I'm clearly done with, then group what's left in Today into Kept folders by topic. Tell me what you did." }
  Short tab titles: { mode: chat, prompt: "Give every tab in this space a short, clear title (2 to 4 words) with rename_tab." }
  Find related reading: { mode: chat, prompt: "Find three good pages related to \"{title}\" ({url}) and open them as background tabs. Say why each is worth reading." }
  Do something on this page…: { mode: chat, prompt: "On the page I'm on ({title}, {url}): {input}" }

# Tasks: things your agents do for you, written in your own words. "Create Task…" in the command bar asks what and
# when, then adds it here. A morning brief from your Jira, joining your Google Meet calls when they start, opening your
# dashboards side by side when Valerie starts, scanning a site for something: all tasks.
tasks: []
#  - name: Morning brief
#    want: "Go through my Jira and tell me what's on my plate today, most urgent first, with links."
#    when: weekdays at 8am       # plain words: "every day at 8am" | "weekdays at 9" | "mon, wed at 5pm" |
#                                #   "every 5 minutes" | "every 2 hours" | "when Valerie starts" | "only when I ask"
#    result: page                # one of: page (a tab in Kept showing the latest result) | chat (a chat logging each
#                                #   run) | notify (just a notification)
#    space: Work                 # where its page tab lives
#    agent: ""                   # which agent (a name under agents.available); empty = agents.use.tasks
#    machine: ""                 # only this computer runs it (set automatically, so synced machines don't double up)
#    enabled: true
#  - name: Join my meetings
#    want: "If a Google Calendar meeting with a Meet link starts in the next 2 minutes, open the Meet link and join."
#    when: every 2 minutes
#    result: notify
briefs: []                     # the older name for tasks that write a page; still read

# Notifications, shown by your computer like any app's.
notifications:
  from_valerie: true       # Valerie's own: a task's result is ready, a watched page changed, a chat answered while
                           # you were in another app. Clicking one takes you to it.
  websites: ask            # sites that want to notify you (Gmail, Slack, Calendar…). one of: ask (Valerie asks the
                           # first time) | allow | deny. They only arrive while the site is open in a tab.
  sites: {}                # your choice per site, e.g. { mail.google.com: allow, news.example.com: deny }; this wins
                           # over the answers you gave when asked (toggle_site_notifications flips the site you're on)
  sound: true              # play the notification sound

# Watch This Page…: describe what to wait for ("the price drops below $500", "checks pass on this PR"); an agent looks
# in the background and tells you once it happens.
watch:
  every_minutes: 30        # how often each watched page is checked
  notify: true             # a system notification when it happens (as well as a chat with the details)

# Privacy
privacy:
  strip_tracking: true     # remove tracking junk from links you open or copy (the parameters below)
  tracking_params: [utm_*, fbclid, gclid, dclid, gbraid, wbraid, msclkid, yclid, twclid, ttclid, igshid, mc_cid, mc_eid,
                    _hsenc, _hsmi, mkt_tok, oly_anon_id, oly_enc_id, vero_id, rb_clickid, li_fat_id, s_cid]
                           # query parameters to remove; a trailing * matches any ending (utm_* = utm_source, utm_medium …)
  cookie_banners: reject   # cookie pop-ups. one of: reject (click "Reject all" when possible, otherwise hide) | hide | off

# What sites may use. one of: ask (Valerie asks the first time a site wants it) | allow | deny
permissions:
  camera: ask
  microphone: ask

# How web pages look
pages:
  dark_mode: off           # make light websites dark. one of: off | system (when your computer is in dark mode) | always
                           # (sites that are already dark are left alone; toggle_dark_page flips it for one site)
  loading_bar: true        # a thin line across the top of a page while it loads
  markdown: true           # show Markdown files (.md, on this computer or the web) as formatted documents: headings,
                           # tables, highlighted code, task lists, GitHub-style notes. false = the plain text
  markdown_theme: auto     # their look. one of: auto (dark when your computer or dark_mode is) | light | dark
  markdown_outline: true   # an outline of the document's headings beside it (a button on narrow windows)
  markdown_live: true      # a file on this computer updates on screen as soon as it's saved (yours or your AI's edits)
  markdown_edit: here      # what Edit does on a file on this computer. one of: here (Valerie's own editor beside a live
                           # preview; saves as you type) | editor (opens it in your `editor` app)
                           # ("Open Markdown Files in Valerie" in the command bar makes Valerie the app .md files open in;
                           # one opened from Finder or another app comes up in a little window)

# Translate page (translate_page command)
translate:
  language: en             # language to translate pages into (a code like en, es, fr, de, ja)
  service: "https://translate.google.com/translate?sl=auto&tl=%l&u=%u"   # %l = language, %u = the page's address

# Capture (capture_page command, ⌘⇧2): a screenshot of the visible page.
capture:
  copy_to_clipboard: true  # put the image on the clipboard
  save_to_downloads: true  # also save it as a PNG in your Downloads folder

# What clicking a link does while holding a modifier. Each is one of:
#   background_tab (open it, stay on this page) | new_tab (open it and switch) | split (open beside this page) |
#   peek (preview it over this page) | little_window | default (let the page decide)
# "cmd" is ⌘ on Mac and Ctrl elsewhere; "option" is ⌥ on Mac and Alt elsewhere.
links:
  middle_click: background_tab
  cmd_click: background_tab
  shift_click: background_tab
  option_click: split
  cmd_shift_click: new_tab
  option_shift_click: peek
  context_menu: true       # Valerie's right-click menu on links (hold shift while right-clicking for the system menu)
  show_url_on_hover: true  # show where a link goes in the bottom corner while you hover it
  popups: window           # pop-up windows a site opens at a set size, like "Sign in with Google". one of:
                           # window (a small window that stays linked to the page, so sign-ins work) | tab

little_window:
  enabled: true            # links opened from other apps appear in a small window (like Little Arc)
  space_picker: true       # a ▾ next to "Open in …" to choose which space the link moves to
  copy_button: false       # a "Copy link" button in the little window's bar (⌘⇧C copies either way)
  keep_open_when_main_closes: true   # closing the main window leaves little windows open (the Dock icon or ⌘T
                           # brings it back; closing the last little window then quits). true | false (false = quit)
  open_links_alone: true   # when the main window is closed or Valerie isn't running, a link from another app opens
                           # only a little window (links routed to a space too). true | false (false = the main
                           # window opens as well)
  width: 960
  height: 700


# --------------------------------------------------------------------------------------------------------------
# Profiles, spaces and link routing
# --------------------------------------------------------------------------------------------------------------

# Settings for one site at a time; anything left out follows the settings above. A host covers its subdomains.
#   sites:
#     meet.google.com: { camera: allow, microphone: allow }
#     youtube.com: { autoplay: false, zoom: 110, unload: false }
#     news.ycombinator.com: { dark_mode: always }
# Each site can set: camera, microphone, notifications (ask | allow | deny) · user_agent (text) · zoom (percent) ·
# autoplay (true | false: video in tabs opened in the background) · dark_mode (off | always) · vim (true | false) ·
# links ({ cmd_click: new_tab, … } like `links`) · unload (false keeps its tabs in memory) · ad_blocking (true | false)
# · popups (window | tab) · cookie_banners (reject | hide | off)
sites: {}

# Profiles keep cookies, logins and site data separate. Each space uses one profile.
profiles:
  - name: Personal
  - name: School
  - name: Work

# Spaces, in sidebar order.
#   theme: a preset (midnight | rose | forest | ocean | grape | ember | sand | paper) or your own:
#          { mode: dark, background: ["#1b1e2b", "#2a2140"], accent: "#ff7ab6", foreground: "#e8e6f0" }
#   icon:  any emoji or symbol
#   settings: any settings from this file that apply while you're in this space, e.g.
#             settings: { pages: { dark_mode: always }, vim: { enabled: false }, search_engine: "https://kagi.com/search?q=%s" }
spaces:
  - name: Personal
    profile: Personal
    theme: midnight
    icon: "✦"
  - name: School
    profile: School
    theme: forest
    icon: "✎"
  - name: Work
    profile: Work
    theme: ocean
    icon: "◆"

# Sites that always use a particular profile (its own cookies and sign-ins), whatever space they're opened in.
# Use it to keep one site on a different account, e.g. YouTube on one Google account and the rest of Google on
# another: add a profile for it under `profiles`, then
#   site_profiles:
#     youtube.com: YouTube
# Leaving the site from that tab keeps its profile (so sign-in pages work); other sites in new tabs use the space's.
site_profiles: {}

# Air Traffic Control: links that match open in a space. A pattern matches the host ("*.edu", "github.com", which
# also covers subdomains) or the whole URL if it contains "://" ("https://docs.google.com/*"). First match wins.
routes:
  - match: "*.edu"
    space: School
  - match: "canvas.instructure.com"
    space: School


# --------------------------------------------------------------------------------------------------------------
# Keyboard
# --------------------------------------------------------------------------------------------------------------

# App shortcuts. Value: a command name, or a command with options like { cmd: switch_space, index: 0 }.
# Modifiers: CmdOrCtrl (⌘ on Mac, Ctrl elsewhere), Cmd, Ctrl, Alt, Shift. Set a shortcut to null to turn it off.
# A key sequence is keys separated by spaces: "CmdOrCtrl+K CmdOrCtrl+S" means ⌘K, then ⌘S.
keybindings:
  "CmdOrCtrl+D": open_command_bar
  # "CmdOrCtrl+T": new_tab           # off by default; uncomment to open the command bar with ⌘T as well
  "CmdOrCtrl+L": { cmd: open_command_bar, mode: current }
  "CmdOrCtrl+W": close_tab
  "CmdOrCtrl+Shift+T": reopen_closed_tab
  "CmdOrCtrl+Shift+C": copy_url
  "CmdOrCtrl+S": toggle_sidebar
  "CmdOrCtrl+Shift+D": toggle_pin
  "CmdOrCtrl+R": reload
  "CmdOrCtrl+[": back
  "CmdOrCtrl+]": forward
  "CmdOrCtrl+Alt+Down": next_tab
  "CmdOrCtrl+Alt+Up": prev_tab
  "Ctrl+Tab": last_tab     # back to the tab you were just on (next_tab to go down the list instead)
  "Ctrl+Shift+Tab": prev_tab
  "CmdOrCtrl+Alt+Right": next_space
  "CmdOrCtrl+Alt+Left": prev_space
  "Ctrl+1": { cmd: switch_space, index: 0 }
  "Ctrl+2": { cmd: switch_space, index: 1 }
  "Ctrl+3": { cmd: switch_space, index: 2 }
  "Ctrl+4": { cmd: switch_space, index: 3 }
  "Ctrl+5": { cmd: switch_space, index: 4 }
  "CmdOrCtrl+1": { cmd: go_to_tab, index: 0 }
  "CmdOrCtrl+2": { cmd: go_to_tab, index: 1 }
  "CmdOrCtrl+3": { cmd: go_to_tab, index: 2 }
  "CmdOrCtrl+4": { cmd: go_to_tab, index: 3 }
  "CmdOrCtrl+5": { cmd: go_to_tab, index: 4 }
  "CmdOrCtrl+6": { cmd: go_to_tab, index: 5 }
  "CmdOrCtrl+7": { cmd: go_to_tab, index: 6 }
  "CmdOrCtrl+8": { cmd: go_to_tab, index: 7 }
  "Ctrl+Shift+Equal": split_view
  "Ctrl+Shift+Minus": unsplit
  "Ctrl+Shift+Right": focus_next_pane
  "CmdOrCtrl+Equal": zoom_in
  "CmdOrCtrl+Minus": zoom_out
  "CmdOrCtrl+0": zoom_reset
  "CmdOrCtrl+Alt+I": dev_tools
  "CmdOrCtrl+O": move_to_main_window
  "CmdOrCtrl+F": find_in_page
  "CmdOrCtrl+Shift+R": reader_view
  "CmdOrCtrl+Shift+2": capture_page
  "CmdOrCtrl+Shift+M": toggle_mute
  "CmdOrCtrl+Shift+V": paste_and_go
  "CmdOrCtrl+P": print
  "CmdOrCtrl+J": open_chats
  "CmdOrCtrl+N": { cmd: new_chat, in_project: true }   # a new chat; in a coding chat, on the same project
  "Ctrl+Quote": toggle_terminal   # the terminal panel (Ctrl+')
  "CmdOrCtrl+Alt+Shift+C": copy_markdown_link
  "CmdOrCtrl+Comma": open_config
  "CmdOrCtrl+Shift+Y": sync

# Shortcuts that work in every app, even when Valerie isn't in front (macOS). Same format as keybindings, e.g.
#   "Ctrl+Alt+Space": open_command_bar       # brings Valerie forward with the command bar open
# Set one to null to turn it off. Another app (Karabiner, Raycast, a script) can open a little window with
#   open -b dev.valerie.browser 'valerie://little'       (or 'valerie://little?url=https://…' for a page)
global_keybindings:
  "Ctrl+Semicolon": new_little_window   # Ctrl+; a new little window from any app, asking where to go

# The menu bar at the top of the screen. Its menus: Valerie, Edit, Tabs, Spaces, View, Tools, Plugins, Window.
menu:
  hide: []                 # menus to leave out of the bar, e.g. [Tools, Plugins]; their shortcuts keep working (the menu
                           # moves inside the Valerie menu)
  rename: {}               # new names for menus, e.g. { Tools: More, Spaces: Desks }
  commands: {}             # which menu a command sits in, by command name, e.g. { reader_view: View, print: Tabs }; a new
                           # name makes a new menu; null takes a command without a shortcut out of the menus
  quit_shortcut: "CmdOrCtrl+Q"   # the shortcut for Quit; "" = none (Quit stays in the Valerie menu)
  confirm_quit: false      # ask "Quit Valerie?" before quitting. true | false

# Valerie's right-click menus (on links, tabs and folders). Plugins add their own entries (`context_menu` on a command).
context_menu:
  hide: []                 # entries to leave out, by their words, e.g. ["Open in Little Window", "Peek", "New Folder…"]

# Mouse buttons. Each is a command (like under keybindings) or null for nothing.
mouse:
  back_button: back        # the mouse's back button (the 4th button) on a page; on pages only commands that can't
  forward_button: forward  # touch other tabs work (back, forward, next_tab, zoom_in …)
  middle_click_tab: close_tab   # middle-clicking a tab in the sidebar (the command acts on that tab)

# Trackpad gestures.
gestures:
  swipe_to_go_back: true   # two-finger swipe sideways on a page goes back / forward. true | false
  pinch_to_zoom: false     # pinch to zoom into a page (like Safari). true | false

# Vim keys inside web pages. They're ignored while you type in a text field (Escape leaves the field).
# Value: a page action (scroll_down | scroll_up | scroll_left | scroll_right | half_page_down | half_page_up | top |
# bottom | hints | hints_new_tab | insert | find | yank_url) or any app command. Set a key to null to turn it off.
vim:
  enabled: true
  key_timeout_ms: 700      # how long Valerie waits for the next key of a two-key command like gg or yy
  scroll_step: 80          # pixels per j / k
  smooth_scroll: true      # glide instead of jumping (j/k, d/U, gg/G)
  scroll_duration_ms: 150  # how long each glide takes; lower = snappier
  hold_to_accelerate: true # holding j/k/h/l scrolls continuously and speeds up until you let go
  block_autofocus: true    # pages can't put the cursor in a text box until you click, so vim keys keep working
  jump_to_text_box: true   # after you click with f (or press Enter in a text box), the cursor goes to the sign-in, reply or compose box that shows up; true | false
  hold_delay_ms: 180       # how long a key must be held before continuous scrolling starts
  hold_scroll_speed: 1000  # starting speed while holding, pixels per second
  hold_scroll_acceleration: 7000   # how quickly it speeds up, pixels per second, per second
  hold_scroll_max_speed: 14000     # top speed while holding, pixels per second
  hint_characters: "sadfjklewcmpgh"   # letters used for `f` link hints, most comfortable first
  excluded_hosts: ["docs.google.com", "mail.google.com", "figma.com"]   # sites with their own keyboard shortcuts
  bindings:
    "j": scroll_down
    "k": scroll_up
    "h": scroll_left
    "l": scroll_right
    "d": half_page_down
    "U": half_page_up
    "u": back
    "gg": top
    "G": bottom
    "f": hints
    "F": hints_new_tab
    "i": insert
    "/": find
    "yy": copy_url
    "H": { cmd: focus_pane, direction: left }    # split view: pane to the left; otherwise back
    "L": { cmd: focus_pane, direction: right }   # split view: pane to the right; otherwise forward
    "r": reload
    "x": close_tab
    "X": reopen_closed_tab
    "J": next_tab            # J down the sidebar, K up (like j/k)
    "K": prev_tab
    "gt": next_tab
    "gT": prev_tab
    "o": open_command_bar
    "O": { cmd: open_command_bar, mode: current }
    "t": new_tab
    "s": toggle_sidebar
    "]s": next_space
    "[s": prev_space


# --------------------------------------------------------------------------------------------------------------
# Privacy: passwords and ad blocking
# --------------------------------------------------------------------------------------------------------------

# Passwords live in the macOS Keychain, one vault per profile.
passwords:
  enabled: true
  save_prompt_seconds: 30  # how long "Save password?" stays up before going away by itself
  offer_passkeys: auto     # tell websites they can sign you in with a passkey. one of: auto (only when passkeys
                           # work: on Mac that needs a permission Apple hasn't given Valerie yet, so sites ask for
                           # your password instead of showing a passkey prompt that never finishes) | on | off
  passkeys_through_safari: true  # when a site asks for a passkey, offer to sign in through Safari (where passkeys
                           # work) and bring the login back. Also "Sign In with Safari" in the command bar. true | false
  shared: []               # vaults several profiles can use, e.g.:
  # shared:
  #   - name: Shared
  #     profiles: [Personal, Work]

# Ad and tracker blocking (lists are downloaded, cached, and refreshed every `refresh_days`).
content_blocking:
  enabled: true
  lists:
    - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  # Sites where blocking is off (or use "Toggle Ad Blocking for This Site"). Google's editors are listed because
  # blockers can make Docs/Sheets fail with a "Loading issue" dialog.
  allow: ["docs.google.com", "drive.google.com", "mail.google.com", "calendar.google.com", "meet.google.com"]
  refresh_days: 7

# Your own network rules, checked in order. Each is one of:
#   - block: "||ads.example.com^"           # stop requests: Adblock syntax, or an address with * wildcards (macOS)
#   - redirect: "https://www.reddit.com/*"  # open another address instead (pages you open, before they load) …
#     to: "https://old.reddit.com/*"        # … where each * is what the matching * in `redirect` matched
#   - hide: "#comments, .promo"             # hide elements on pages (CSS selectors)
#   - header: "DNT: 1"                      # send this header with pages you open from Valerie (typed addresses, new
#                                           #   tabs, links Valerie opens); a page's own requests aren't changed
# Add `site: example.com` to a rule to limit it to that site. The lists under content_blocking.lists may also be Adblock
# filter lists (EasyList and the like): Valerie understands hosts files and Adblock syntax.
rules: []


# --------------------------------------------------------------------------------------------------------------
# AI agents
# --------------------------------------------------------------------------------------------------------------

# Built-in MCP server so AI agents can use the browser. Connect Claude Code with: $(valerie mcp-config)
mcp:
  enabled: true
  port: 7777

# Headless agents run on your own Claude Code / Codex / OpenCode login. Type "> task" in the command bar, or
# schedule jobs here.
# AI. Valerie uses the agent apps already on your computer, signed in with your own subscriptions: Claude Code,
# Codex, OpenCode, Pi, Cursor and Hermes. Pick "Set Up <name>" in the command bar to install one and sign in (one
# step). They power the Chats space (left of your first space), questions you type into find (/), "Ask …" in the
# command bar (an agent that can see and use your whole browser), scheduled jobs, and "! change …" customizing.
agents:
  default: claude          # the agent used when a job below doesn't name one (a name from `available`)
  timeout_minutes: 20      # stop an agent that's still running after this long
  available:               # your agents by name. cli: one of claude | codex | opencode | pi | cursor | hermes
    claude:   { cli: claude }      # model: "" = the CLI's own default; e.g. { cli: claude, model: opus }
    codex:    { cli: codex }
    opencode: { cli: opencode }    # model like "anthropic/claude-sonnet-4-5"
    pi:       { cli: pi }
    cursor:   { cli: cursor }
    hermes:   { cli: hermes }
    # Add as many as you like, e.g. a fast one for find and a strong one for chat:
    #   quick:  { cli: claude, model: haiku }
    #   strong: { cli: codex, model: gpt-5 }
    #   local:  { command: ["ollama", "run", "llama3", "{prompt}"] }   # any program that prints an answer
  models:                  # extra names for a chat's model picker; each CLI's own list is read automatically
                           # (Cursor, OpenCode, Codex, Hermes and Pi report theirs; Claude Code uses these aliases)
    claude: [opus, sonnet, haiku]
    codex: []
    opencode: []
    pi: []
    cursor: []
    hermes: []
  use:                     # which agent (a name above) does each job; "" = default
    chat: ""               # Chats and "Ask …" in the command bar: can see and use your whole browser
    find: ""               # questions typed into find (/) about the page: it sees only that page and runs with as
                           # little power as its CLI allows (no tools for claude, pi, opencode; read-only, offline
                           # and in an empty folder for codex, cursor, hermes). Answers show in Valerie's own panel.
    tasks: ""              # scheduled jobs (below)
    customize: ""          # "! make the text bigger" in the command bar: edits Valerie's settings
  model: ""                # empty = the CLI's default model (e.g. "sonnet", "gpt-5", "anthropic/claude-sonnet-4")
  space: Agents            # agents open their tabs in this space and leave yours alone
  instructions: ""         # extra instructions for every agent, after Valerie's own safety rules (e.g. "Answer in Spanish.")
  instructions_for:        # extra instructions for one job, after `instructions`
    chat: ""               # Chats and "Ask …"
    find: ""               # questions typed into find
    tasks: ""              # tasks and watched pages
    customize: ""          # "! change …" requests
  jobs: []                 # the older form of `tasks` (below): { name, prompt, at: "08:30" or every: 30m, agent }; still read
  fallback: true           # when the agent a job uses isn't installed on this computer, use one that is (Claude Code,
                           # Codex, OpenCode, Pi, Cursor, Hermes, in that order) and say so once. true | false


# --------------------------------------------------------------------------------------------------------------
# Sync and themes
# --------------------------------------------------------------------------------------------------------------

# Sync pinned tabs, folders, favorites and spaces through a private GitHub repo you own. `valerie sync-setup`
# creates one.
# Sync: your settings, boosts, plugins and tabs, on every machine. Run "Set Up Sync" from the command bar (or
# `valerie sync-setup`): it signs you in to GitHub, makes a private repo and fills in `repo` below. This config folder
# becomes a git checkout of that repo, so on a new machine you can also just clone the repo into the config folder.
sync:
  repo: ""                 # the sync repo's address, e.g. https://github.com/you/valerie-sync.git; empty = sync off
  device: ""               # this machine's name as other machines show it; empty = the computer's name (set it in
                           # this-mac.yaml, since config.yaml is shared by every machine)
  encrypt: true            # encrypt tabs, chats and passwords with your sync passphrase before they reach the repo
                           # (typed once per machine; "Sync Passphrase" in the command bar sets, enters or changes
                           # it, or starts over if it's forgotten everywhere). false = tabs and chats
                           # go up readable and passwords don't sync
  passwords: true          # sync saved passwords too (encrypted; needs `encrypt`). true | false
  ask_before_plugins: true # plugins and AI programs that arrive from another machine wait until you allow them on
                           # this one ("Allow Plugins from Other Machines"). false = they run straight away
  repo_key: true           # each machine syncs with its own key that can reach only the sync repo (no GitHub
                           # sign-in kept). false = sync with your GitHub sign-in, which can reach all your repos
  on_change: true          # sync shortly after you change tabs or settings
  delay_seconds: 10        # how long after a change to sync (changes in the meantime go along too)
  interval_minutes: 5      # also check for other machines' changes this often; 0 = only on change and ⌘⇧Y
  repo_name: valerie-sync  # name of the private GitHub repo "Set Up Sync" creates or reuses
  github_client_id: ""     # a GitHub OAuth app's client ID for signing in without the GitHub CLI (device flow);
                           # empty = sign in through the GitHub CLI (`gh`)

# Updates: Valerie looks for a newer version now and then and installs it quietly; it starts the next time you open
# Valerie (or right away with "Restart Valerie"). Updates must be signed with Valerie's release key.
updates:
  check: true              # look for a newer Valerie by itself (you can always run "Check for Updates")
  every_hours: 6           # how often to look, in hours
  install: auto            # one of: auto (download and install it quietly) | ask (say there's one; "Check for Updates"
                           # installs it) | off (only say there's one)
  channel: stable          # which builds you get. one of: stable (releases the maintainer has tried and approved) |
                           # edge (every change as soon as it's built, for testing; put it in this-mac.yaml). Going
                           # back to stable from a newer edge build waits for stable to catch up (no downgrades)
  feed: "https://github.com/cullen-b/valerie/releases/latest/download/latest.json"   # where stable releases are
                           # described (a fork can point this at its own releases)

# Valerie's log: what went wrong and what happened (sync, updates, plugins, commands, agents' tool calls, …), one file
# a day in the `logs` folder inside Valerie's data folder (`valerie paths` shows where). Read it, or ask your AI to
# (agents read it with the read_logs tool), when something fails. Passwords, tokens and keys are never written to it.
logs:
  keep_days: 7             # remove log files older than this many days; 0 = don't write log files
  level: events            # how much to write. one of: errors (failures and messages you saw) | events (also commands
                           # run, agents' tool calls with how long they took, plugin messages, crashed pages) |
                           # verbose (also every page load)

# The plugin marketplace: plugins people shared ("Plugins" in the command bar to browse and install them).
plugin_marketplace:
  index: "https://raw.githubusercontent.com/cullen-b/valerie-plugins/main/index.json"   # where the list of plugins comes from
  repo: cullen-b/valerie-plugins   # where "Share Plugin" sends yours (as a pull request the maintainers review)
  offer_to_share: true     # when your AI makes a new plugin, offer to share it in the marketplace. true | false

# Your own themes, used by name in `spaces` (same shape as the inline theme above).
themes: {}

# Valerie in the Dock and the menu bar (macOS).
app:
  icon: ""                 # a picture (PNG, JPEG or ICNS; ~ allowed) to use as Valerie's Dock icon; empty = the usual one
  dock_menu: []            # commands in the Dock icon's right-click menu, e.g. [new_tab, { cmd: switch_space, name: Work }]
  menu_bar_icon: ""        # text or an emoji for an icon at the right of the menu bar (e.g. "✦"); empty = no icon
  menu_bar_menu: [open_command_bar, new_tab, open_chats]   # what that icon's menu offers

# Browser extensions: Safari-style web extensions (unpacked folders with a manifest.json), macOS 15.4 or later. Put
# each extension's folder in the `extensions` folder next to this file; "Extensions" in the command bar lists them.
extensions:
  enabled: true            # load the extensions in that folder. true | false
  folder: ""               # where they live; empty = the extensions folder next to this file
