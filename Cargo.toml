[package]
name = "valerie"
version = "0.1.0"
edition = "2021"
description = "A fast, configurable, agent-native browser written in Rust"
license = "MIT"

[dependencies]
wry = { version = "0.57", features = ["devtools"] }
tao = "0.37"
muda = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tiny_http = "0.12"
dirs = "7"
arboard = "3"
anyhow = "1"
url = "2"
plist = "1"
chacha20poly1305 = "0.10"
argon2 = "0.5"
sha2 = "0.10"
getrandom = "0.2"
portable-pty = "0.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"

[profile.release]
lto = "thin"
codegen-units = 4
