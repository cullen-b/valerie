<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16151c" media="(prefers-color-scheme: dark)">
<title>Valerie games</title>
<style>
:root { --bg: #fff; --fg: #222; --dim: #888; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg: #16151c; --fg: #ecebf5; --dim: #8a8996; } }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); }
body { display: grid; justify-items: center; align-items: start; min-height: 100vh; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
main { width: min(640px, 100% - 32px); padding: 16px 0 32px; }
canvas { display: block; width: 100%; aspect-ratio: 210 / 148; image-rendering: pixelated; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
canvas:focus-visible { outline: 2px solid var(--fg); outline-offset: 6px; }
p { color: var(--dim); text-align: center; text-wrap: balance; margin: 12px 0 0; }
#msg { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<main>
<canvas id="table" width="210" height="148" tabindex="0" role="img" aria-label="The game table. Click cards and buttons, or use the arrow keys and Space."></canvas>
<p id="msg" role="status"></p>
<p id="note" aria-live="polite">Joining the game…</p>
</main>
<script>
(() => {
  const W = 210, H = 148, cv = document.getElementById("table"), ctx = cv.getContext("2d"), note = document.getElementById("note");
  const base = location.pathname.replace(/\/+$/, "");
  const night = matchMedia("(prefers-color-scheme: dark)").matches;
  let id = "", v = 0, over = false, img = null;
  const say = t => { note.textContent = t; };
  const show = () => {
    if (!img) return;
    const r = cv.getBoundingClientRect(), s = Math.max(1, Math.round((r.width || W) / W * devicePixelRatio));
    if (cv.width !== W * s) { cv.width = W * s; cv.height = H * s; }
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
  };
  const end = t => { over = true; say(t); };
  const join = async () => {
    const r = await fetch(base + "/join", { method: "POST", body: JSON.stringify({ night }) }).catch(() => null);
    if (!r || r.status === 404) return end("This game has ended. Ask the host for a new link.");
    if (r.status === 429) return end("This game is full. Ask the host to let you know when there’s room.");
    id = (await r.json()).id; v = 0;
    say("Waiting for the table…");
  };
  const poll = async () => {
    while (!over) {
      if (!id) { await join(); continue; }
      const r = await fetch(base + "/frame?id=" + id + "&since=" + v).catch(() => null);
      if (!r) { say("Lost the connection. Trying again…"); await new Promise(f => setTimeout(f, 2000)); continue; }
      if (r.status === 404) return end("This game has ended. Ask the host for a new link.");
      if (r.status === 410) { id = ""; continue; }
      const f = await r.json();
      if (f.v <= v || !f.png) continue;
      v = f.v;
      const next = new Image();
      next.onload = () => { img = next; show(); };
      next.src = f.png;
      document.getElementById("msg").textContent = String(f.msg || "").toLowerCase();
      say("Click the cards and buttons, or use the arrow keys and Space.");
    }
  };
  const send = m => { if (id && !over) fetch(base + "/input?id=" + id, { method: "POST", body: JSON.stringify(m) }).catch(() => {}); };
  cv.addEventListener("click", e => {
    const r = cv.getBoundingClientRect();
    send({ type: "click", x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H });
  });
  addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
    const k = e.key.toLowerCase();
    if (!/^(arrow(left|right|up|down)|enter|escape| |[a-z0-9?=+-])$/.test(k)) return;
    e.preventDefault();
    send({ type: "key", k });
  });
  addEventListener("resize", show);
  addEventListener("pagehide", () => { if (id) navigator.sendBeacon(base + "/leave?id=" + id); });
  poll();
})();
</script>
</body>
</html>
