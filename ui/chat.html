<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: #16151c; --fg: #ecebf5; --dim: rgba(236,235,245,.55); --faint: rgba(236,235,245,.08); --line: rgba(255,255,255,.08);
  --card: rgba(255,255,255,.045); --accent: #9d8cff; --danger: #ff7a7a; --add: #5fd38d; --del: #ff7a7a; --warn: #f0b45a;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
:root.light { --bg: #fbfaf8; --fg: #23201c; --dim: rgba(35,32,28,.55); --faint: rgba(0,0,0,.05); --line: rgba(0,0,0,.08); --card: rgba(0,0,0,.035);
  --add: #1f8a4c; --del: #c43c3c; --warn: #b7791f; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
body { font: 14.5px/1.6 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
#top { position: absolute; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 18px;
  border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); z-index: 5; }
#top .title { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#top .agent, #top .proj { font-size: 11.5px; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; flex: none; white-space: nowrap; }
#top .proj { font-family: var(--mono); font-size: 11px; }
#top .proj b { font-weight: 500; color: var(--fg); }
#scroll { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 24px 24px 220px; }
#scroll::-webkit-scrollbar { width: 8px; } #scroll::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 8px; }
#log { max-width: 800px; margin: 0 auto; }
.msg { margin: 0 0 22px; }
.msg.user { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.msg.user .bubble { max-width: 82%; padding: 9px 14px; border-radius: 16px 16px 4px 16px; background: var(--card); border: 1px solid var(--line);
  white-space: pre-wrap; word-wrap: break-word; }
.files { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.file { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); border: 1px solid var(--line); border-radius: 10px; padding: 3px 8px 3px 3px; background: var(--card); }
.file img { width: 34px; height: 34px; object-fit: cover; border-radius: 7px; display: block; }
.file .ph { width: 34px; height: 34px; border-radius: 7px; display: grid; place-items: center; background: var(--faint); }
.file .rm { cursor: default; padding: 0 2px; } .file .rm:hover { color: var(--fg); }
.msg.assistant .who { font-size: 11.5px; color: var(--dim); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; min-width: 0; }
.msg.assistant .who i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; flex: none; }
.who .doing { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
.who .doing::before { content: "· "; }
/* legacy list of tool names */
.work { margin: 2px 0 8px; font: 12px/1.5 var(--mono); color: var(--dim); }
.work summary { cursor: default; list-style: none; user-select: none; }
.work summary::-webkit-details-marker { display: none; }
.work summary::before { content: "▸ "; } .work[open] summary::before { content: "▾ "; }
.work div { padding-left: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* steps */
.steps { margin: 6px 0 10px; border-left: 2px solid var(--line); padding-left: 10px; }
.steps > .sum { font-size: 12.5px; color: var(--dim); cursor: default; user-select: none; display: flex; gap: 6px; align-items: center; padding: 2px 0; }
.steps > .sum:hover { color: var(--fg); }
.steps > .sum::before { content: "▸"; font-size: 10px; width: 10px; } .steps.open > .sum::before { content: "▾"; }
.steps:not(.open) > .list { display: none; }
.steps.flat > .sum { display: none; }
.step { font-size: 12.5px; }
.step .row { display: flex; align-items: center; gap: 7px; padding: 2px 0; color: var(--dim); cursor: default; user-select: none; min-width: 0; }
.step .row:hover { color: var(--fg); }
.step .verb { flex: none; color: var(--fg); opacity: .85; }
.step .det { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.step .det.link:hover { text-decoration: underline; color: var(--accent); }
.step .n { flex: none; font-family: var(--mono); font-size: 11px; } .n .a { color: var(--add); } .n .d { color: var(--del); }
.step .ms { margin-left: auto; flex: none; font-size: 11px; font-variant-numeric: tabular-nums; opacity: .8; padding-left: 8px; }
.step .ic { width: 12px; flex: none; text-align: center; font-size: 11px; }
.step.error .ic, .step.error .verb { color: var(--danger); }
.step.running .ic { width: 10px; height: 10px; border-radius: 50%; border: 1.6px solid color-mix(in srgb, var(--accent) 30%, transparent); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.step .body { margin: 4px 0 8px 19px; }
.step.thinking .body { color: var(--dim); font-style: italic; white-space: pre-wrap; font-size: 12.5px; max-height: 260px; overflow: auto; }
pre.out { margin: 0; font: 11.5px/1.5 var(--mono); background: var(--faint); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap;
  word-break: break-word; max-height: 300px; overflow: auto; color: var(--fg); }
pre.out .cmd { color: var(--accent); }
.diff { font: 11.5px/1.5 var(--mono); border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: 420px; background: var(--faint); }
.diff div { white-space: pre; padding: 0 10px; min-height: 1.5em; }
.diff .a { background: color-mix(in srgb, var(--add) 14%, transparent); } .diff .a::before { content: "+ "; color: var(--add); }
.diff .d { background: color-mix(in srgb, var(--del) 14%, transparent); } .diff .d::before { content: "- "; color: var(--del); }
.diff .c::before { content: "  "; } .diff .h { color: var(--dim); background: var(--card); }
.diff .f { color: var(--fg); font-weight: 600; background: var(--card); padding: 6px 10px; border-top: 1px solid var(--line); position: sticky; top: 0; }
.todos { margin: 4px 0 8px 19px; padding: 0; list-style: none; font-size: 13px; }
.todos li { display: flex; gap: 8px; align-items: baseline; padding: 1px 0; }
.todos li::before { content: "○"; color: var(--dim); flex: none; }
.todos li.in_progress::before { content: "◐"; color: var(--accent); } .todos li.in_progress { font-weight: 550; }
.todos li.completed::before { content: "●"; color: var(--add); } .todos li.completed { color: var(--dim); text-decoration: line-through; }
.foot { margin-top: 6px; font-size: 11.5px; color: var(--dim); display: flex; gap: 10px; align-items: center; }
.foot button { font: inherit; color: var(--dim); background: none; border: 1px solid var(--line); border-radius: 7px; padding: 1px 8px; }
.foot button:hover { color: var(--fg); background: var(--faint); }
.md p { margin: 0 0 .7em; } .md p:last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3 { font-size: 1.05em; margin: 1em 0 .4em; }
.md ul, .md ol { margin: 0 0 .7em; padding-left: 1.3em; } .md li { margin: .15em 0; }
.md code { font: .88em var(--mono); background: var(--faint); padding: 1px 5px; border-radius: 5px; }
.md code.path { cursor: default; } .md code.path:hover { color: var(--accent); text-decoration: underline; }
.md pre { position: relative; background: var(--faint); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow-x: auto; margin: 0 0 .8em; }
.md pre code { background: none; padding: 0; }
.md pre .cp { position: absolute; top: 6px; right: 6px; display: none; font: 11px -apple-system, system-ui, sans-serif; color: var(--dim); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 7px; background: var(--bg); }
.md pre:hover .cp { display: block; } .md pre .cp:hover { color: var(--fg); }
.md a { color: var(--accent); text-decoration: none; } .md a:hover { text-decoration: underline; }
.md blockquote { margin: 0 0 .7em; padding-left: 10px; border-left: 3px solid var(--line); color: var(--dim); }
.md table { border-collapse: collapse; margin: 0 0 .8em; font-size: 13px; } .md td, .md th { border: 1px solid var(--line); padding: 4px 9px; text-align: left; }
.caret::after { content: ""; display: inline-block; width: 7px; height: 1.05em; margin-left: 2px; vertical-align: -2px; background: var(--accent);
  border-radius: 2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.err { margin-top: 6px; padding: 8px 12px; border-radius: 10px; color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); font-size: 13px; white-space: pre-wrap; }
.card { border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 12px 14px; margin: 0 0 18px; }
.card h4 { margin: 0 0 8px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card h4 .sub { font-weight: 400; color: var(--dim); font-size: 12px; font-family: var(--mono); }
.card .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.btn { font: 12.5px -apple-system, system-ui, sans-serif; color: var(--fg); background: var(--faint); border: 1px solid var(--line); border-radius: 8px; padding: 4px 11px; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.btn.go { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.quiet { background: none; border-color: transparent; color: var(--dim); } .btn.quiet:hover { color: var(--fg); }
.ask { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); background: color-mix(in srgb, var(--warn) 7%, var(--card)); }
.ask h4::before { content: "●"; color: var(--warn); font-size: 10px; }
.changes .file-row { display: flex; align-items: center; gap: 8px; font: 12px/1.7 var(--mono); padding: 0 4px; border-radius: 6px; cursor: default; }
.changes .file-row:hover { background: var(--faint); }
.changes .st { width: 16px; flex: none; color: var(--dim); text-align: center; }
.changes .st.A, .changes .st.U { color: var(--add); } .changes .st.D { color: var(--del); } .changes .st.M { color: var(--warn); }
.changes .p { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
.changes .more { font-size: 12px; color: var(--dim); padding: 2px 4px; }
#empty { max-width: 640px; margin: 14vh auto 0; text-align: center; }
#empty .mark { font-size: 34px; color: var(--accent); }
#empty h1 { font-size: 21px; font-weight: 600; margin: 10px 0 6px; letter-spacing: -.3px; }
#empty p { color: var(--dim); margin: 0 0 22px; }
#empty .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: default; }
.chip:hover { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
#composer { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 24px 20px; pointer-events: none;
  background: linear-gradient(transparent, var(--bg) 40%); }
#plan-now { max-width: 800px; margin: 0 auto 8px; pointer-events: auto; display: none; border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--bg) 85%, var(--card));
  padding: 6px 12px; font-size: 12.5px; }
#plan-now summary { cursor: default; color: var(--dim); list-style: none; user-select: none; }
#plan-now summary::-webkit-details-marker { display: none; }
#plan-now .todos { margin: 4px 0 2px; }
#box { pointer-events: auto; max-width: 800px; margin: 0 auto; border: 1px solid var(--line); border-radius: 18px; background: color-mix(in srgb, var(--bg) 80%, var(--card));
  box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 10px 12px 8px; transition: border-color .15s; }
#box:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
#box.drop { border-color: var(--accent); border-style: dashed; }
#attach { display: none; justify-content: flex-start; margin-bottom: 8px; }
textarea { width: 100%; resize: none; border: 0; outline: none; background: none; color: var(--fg); font: inherit; max-height: 220px; min-height: 24px; padding: 2px 2px 6px; }
textarea::placeholder { color: var(--dim); }
#row { display: flex; align-items: center; gap: 8px; min-width: 0; }
select { appearance: none; background: var(--faint); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 3px 22px 3px 9px; font: 12px inherit;
  background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
  background-position: calc(100% - 11px) 50%, calc(100% - 7px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }
#hint { flex: 1; font-size: 11.5px; color: var(--dim); text-align: right; white-space: nowrap; overflow: hidden; }
.ctl { appearance: none; background: transparent; color: var(--dim); border: 1px solid transparent; border-radius: 8px; padding: 3px 8px; font: 12px inherit; min-width: 0; }
.ctl:hover { background: var(--faint); color: var(--fg); }
.ctl:focus { outline: none; } .ctl:focus-visible { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
select.ctl { padding-right: 20px; background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
  background-position: calc(100% - 10px) 52%, calc(100% - 6px) 52%; background-size: 4px 4px; background-repeat: no-repeat; }
select.ctl:disabled { background-image: none; padding-right: 8px; opacity: 1; }
#model { max-width: 190px; } #folder { max-width: 170px; font-family: var(--mono); font-size: 11.5px; }
#access.full { color: var(--dim); } #access.ask { color: var(--warn); } #access.read { color: #6fc7a0; }
#plan.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.sep { width: 1px; height: 14px; background: var(--line); flex: none; }
/* The composer's menus: drawn here so they match the chat, not the system's popup. */
#menu { position: fixed; z-index: 50; min-width: 150px; max-height: 50vh; overflow-y: auto; padding: 4px; border-radius: 12px;
  background: color-mix(in srgb, var(--bg) 92%, var(--fg)); border: 1px solid var(--line); font-size: 12.5px;
  box-shadow: 0 12px 32px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.2); opacity: 0; transform: translateY(4px);
  transition: opacity .12s ease-out, transform .12s ease-out; }
:root.light #menu { background: #fff; box-shadow: 0 12px 32px rgba(0,0,0,.12), 0 2px 6px rgba(0,0,0,.06); }
#menu.on { opacity: 1; transform: none; }
#menu.up { transform: translateY(-4px); } #menu.up.on { transform: none; }
#menu .it { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 8px; border-radius: 8px; color: var(--fg); cursor: default; white-space: nowrap; }
#menu .it::before { content: ""; width: 12px; flex: none; color: var(--accent); font-size: 11px; }
#menu .it.cur::before { content: "✓"; }
#menu .it.hi { background: var(--faint); }
#menu .grp { padding: 7px 10px 3px 28px; font-size: 10.5px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--dim); }
#menu::-webkit-scrollbar { width: 6px; } #menu::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 6px; }
#queue { max-width: 800px; margin: 0 auto 6px; pointer-events: auto; display: none; }
#queue div { font-size: 12px; color: var(--dim); padding: 4px 12px; border: 1px dashed var(--line); border-radius: 10px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#working { font-size: 11.5px; color: var(--accent); flex: none; font-variant-numeric: tabular-nums; }
.msg.assistant { position: relative; }
.copy { position: absolute; top: -2px; right: 0; display: none; font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; background: var(--bg); }
.msg.assistant:hover .copy { display: block; } .copy:hover { color: var(--fg); }
#send { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 15px; display: grid; place-items: center; flex: none; }
#send:disabled { opacity: .35; }
#send.stop { background: var(--fg); color: var(--bg); font-size: 11px; }
/* the diff pane */
#pane { position: absolute; inset: 0; z-index: 20; background: var(--bg); display: none; flex-direction: column; }
#pane.on { display: flex; }
/* a chat started from a space floats in the middle, where the command bar was, over the dimmed page */
html.float { background: rgba(0,0,0,var(--fdim, .22)); animation: dimIn 220ms ease both; }
html.float body { position: fixed; left: 50%; top: var(--ftop, 18%); transform: translateX(-50%);
  width: min(var(--fw, 680px), calc(100vw - 32px)); height: min(62vh, calc(100vh - var(--ftop, 18%) - 24px)); min-height: 220px;
  border-radius: 16px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 28px 90px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.25);
  animation: growIn 300ms cubic-bezier(.2,.85,.25,1) both; }
html.float #scroll { padding-left: 18px; padding-right: 18px; }
html.float #composer { padding: 0 14px 14px; }
html.leaving { animation: dimOut 160ms ease both; }
html.leaving body { animation: shrinkOut 160ms ease both; }
@keyframes dimIn { from { background: transparent; } }
@keyframes dimOut { to { background: transparent; } }
/* it grows down out of the command bar's box */
@keyframes growIn { from { height: 64px; min-height: 0; opacity: .4; } 60% { opacity: 1; } }
@keyframes shrinkOut { to { opacity: 0; transform: translateX(-50%) translateY(10px) scale(.97); } }
#toChats, #floatHint { display: none; }
html.float #toChats { display: grid; }
html.float.hints #floatHint { display: block; font-size: 11px; color: var(--dim); white-space: nowrap; }
#termBtn { font-family: var(--mono); font-size: 11.5px; padding: 3px 8px; }
#pane header { height: 44px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 18px; border-bottom: 1px solid var(--line); font-size: 13px; }
#pane header b { font-weight: 600; } #pane header .sub { color: var(--dim); font-family: var(--mono); font-size: 11.5px; flex: 1; }
#pane .split { flex: 1; display: flex; min-height: 0; }
#pane nav { width: 260px; flex: none; border-right: 1px solid var(--line); overflow: auto; padding: 8px 6px; }
#pane nav .file-row { display: flex; gap: 6px; font: 11.5px/1.9 var(--mono); padding: 0 8px; border-radius: 6px; cursor: default; white-space: nowrap; }
#pane nav .file-row:hover, #pane nav .file-row.on { background: var(--faint); }
#pane nav .p { flex: 1; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
#pane .diffwrap { flex: 1; overflow: auto; padding: 12px 16px 60px; }
#pane .diff { max-height: none; border-radius: 10px; }
#pane .loading { color: var(--dim); padding: 30px; text-align: center; }
</style>
</head>
<body>
<div id="top"><div class="title" id="title">New chat</div><div class="proj" id="projBadge"></div><div class="agent" id="agentBadge"></div><div style="flex:1"></div><div id="working"></div><div id="floatHint">esc · keep working&nbsp;&nbsp;⇧esc · go to Chats</div><button class="btn quiet" id="toChats" title="Open in Chats (⇧Esc)">⤢</button><button class="btn quiet" id="termBtn" title="Terminal in this project (Ctrl+')">&gt;_</button></div>
<div id="scroll"><div id="log"></div></div>
<div id="composer"><details id="plan-now" open><summary></summary><ul class="todos"></ul></details><div id="queue"></div><div id="box">
  <div id="attach" class="files"></div>
  <textarea id="input" rows="1" placeholder="Ask anything, or ask for something to be done…"></textarea>
  <div id="row">
    <select id="folder" class="ctl" title="The project folder the agent works in"></select>
    <select id="agent" class="ctl" title="Which agent answers"></select>
    <select id="model" class="ctl" title="Model"></select>
    <select id="effort" class="ctl" title="Reasoning effort">
      <option value="">default effort</option><option value="low">low effort</option><option value="medium">medium effort</option>
      <option value="high">high effort</option><option value="max">max effort</option>
    </select>
    <div class="sep"></div>
    <select id="access" class="ctl" title="What the agent may do">
      <option value="read">Read only</option><option value="ask">Ask first</option><option value="full">Full access</option>
    </select>
    <button id="plan" class="ctl" title="Plan first: the agent proposes, you say go">Plan</button>
    <div id="hint">↵ send · ⇧↵ new line</div><button id="send" title="Send">↑</button>
  </div>
</div></div>
<div id="pane"><header><b>Changes</b><span class="sub" id="paneSub"></span><button class="btn quiet" id="paneRefresh">Refresh</button><button class="btn quiet" id="paneClose" title="Close">✕</button></header>
  <div class="split"><nav id="paneNav"></nav><div class="diffwrap" id="paneDiff"></div></div></div>
<script>
const $ = (s) => document.querySelector(s);
const send = (o) => window.ipc.postMessage(JSON.stringify(o));
const cmd = (c) => send({ t: "cmd", cmd: c });
let D = null;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// ---------- paths ----------
// A path as short as it can be: inside the chat's folder it's relative, elsewhere ~ stands for home.
function shortPath(p) {
  if (!p) return "";
  const f = D && D.chat && D.chat.folder;
  if (f && p.startsWith(f + "/")) return p.slice(f.length + 1);
  if (D && D.home && p.startsWith(D.home + "/")) return "~" + p.slice(D.home.length);
  return p;
}

    r.title = "Double-click to open in your editor";
    nav.append(r);
  });
  $("#paneDiff").replaceChildren(el("div", "loading", "Loading…"));
  cmd({ cmd: "chat_diff", chat: D.chat.id });
}
function closePane() { $("#pane").classList.remove("on"); }
$("#paneClose").onclick = closePane;
$("#paneRefresh").onclick = () => { cmd({ cmd: "chat_changes", chat: D.chat.id }); openPane(paneFocus); };
addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if ($("#pane").classList.contains("on")) { e.preventDefault(); closePane(); return; }
  if (D && D.float) { e.preventDefault(); leaveFloat(e.shiftKey); }
});
// A floating chat goes on to Chats: fade it out first (Shift: the user goes with it, no fade needed).
let leaving = false;
function leaveFloat(follow) {
  if (leaving) return;
  if (follow) return send({ t: "float_close", follow: true });
  leaving = true;
  document.documentElement.classList.add("leaving");
  setTimeout(() => send({ t: "float_close", follow: false }), 150);
}
// A click on the dimmed page around the card works like Esc.
addEventListener("mousedown", (e) => { if (D && D.float && e.target === document.documentElement) leaveFloat(false); });

// ---------- the conversation ----------
function atBottom() { const s = $("#scroll"); return s.scrollHeight - s.scrollTop - s.clientHeight < 80; }
function toBottom() { const s = $("#scroll"); s.scrollTop = s.scrollHeight; }

function renderLog() {
  const log = $("#log"); log.replaceChildren();
  const c = D.chat;
  if (!c || !c.messages.length) {
    const e = el("div"); e.id = "empty";
    const coding = c && c.folder;
    e.append(el("div", "mark", "✦"), el("h1", null, coding ? "What should we build in " + folderName(c.folder) + "?" : "Ask anything"),
      el("p", null, coding ? "Your agent works in this folder like it would in a terminal, and can use your browser to check what it builds."
        : "Your agent can see and use your whole browser: open tabs, read pages, click, fill in, and report back. Pick a folder below to have it work on code."));
    const chips = el("div", "chips");
    (coding ? ["What does this project do?", "Run the tests and fix what fails", "Start the dev server and show me the app"] : D.suggestions || [])
      .forEach((s) => { const c2 = el("div", "chip", s); c2.onclick = () => submit(s); chips.append(c2); });
    e.append(chips); log.append(e); return;
  }
  c.messages.forEach((m, i) => log.append(msgEl(m, i, D.running && i === c.messages.length - 1 && m.role === "assistant")));
  renderCards();
}

// The latest plan of a running answer, kept in view above the composer.
function renderPlanNow() {
  const box = $("#plan-now"), c = D.chat, m = c && c.messages[c.messages.length - 1];
  const todo = D.running && m && m.role === "assistant" && [...(m.steps || [])].reverse().find((s) => s.name === "TodoWrite" && s.todos && s.todos.length);
  if (!todo) { box.style.display = "none"; return; }
  box.style.display = "block";
  const done = todo.todos.filter((t) => t.state === "completed").length, now = todo.todos.find((t) => t.state === "in_progress");
  box.querySelector("summary").textContent = `Plan · ${done}/${todo.todos.length} done` + (now ? " · " + now.text : "");
  box.querySelector(".todos").replaceWith(todoList(todo.todos));
}

// ---------- composer ----------
// Options picked before a chat exists (they go along with its first message).
let pending = {};
function chatOpt(k, fallback) { const c = D.chat; return c && c.messages.length ? (c[k] ?? fallback) : (pending[k] ?? (c && c[k]) ?? fallback); }
// The model list comes from the agent's CLI (grouped by provider where it has them).
function fillModels(current) {
  const info = (D.models || {})[$("#agent").value] || {}, sel = $("#model"); sel.replaceChildren();
  // The model it uses when none is picked, by name (the app's own setting, or "Auto" when the app decides).
  const def = el("option", null, (info.default_model || "Auto") + " (default)"); def.value = ""; sel.append(def);
  const groups = new Map();
  (info.models || []).forEach((m) => {
    const o = el("option", null, m.label || m.id); o.value = m.id;
    if (!m.group) return sel.append(o);
    if (!groups.has(m.group)) { const g = el("optgroup"); g.label = m.group; groups.set(m.group, g); sel.append(g); }
    groups.get(m.group).append(o);
  });
  if (current && ![...sel.options].some((o) => o.value === current)) { const o = el("option", null, current); o.value = current; sel.append(o); }
  sel.value = current || "";
  fillEfforts();
}
// Codex says which reasoning levels each model supports; others get the usual four.
function fillEfforts() {
  // The model that will answer: the one picked, else the agent's default. Its own levels when it lists them (none at
  // all: only the default), else the usual four.
  const info = (D.models || {})[$("#agent").value] || {}, id = $("#model").value || info.default_model;
  const m = (info.models || []).find((x) => x.id === id);
  const levels = m && Array.isArray(m.efforts) ? m.efforts : ["low", "medium", "high", "max"];
  const sel = $("#effort"), cur = sel.value; sel.replaceChildren();
  const d = el("option", null, (info.default_effort || "auto") + " effort (default)"); d.value = ""; sel.append(d);
  // OpenCode's models name their own levels; a few are on/off rather than how hard.
  const named = { none: "no thinking", thinking: "thinking", minimal: "minimal effort" };
  levels.forEach((l) => { const o = el("option", null, named[l] || l + " effort"); o.value = l; sel.append(o); });
  sel.value = levels.includes(cur) ? cur : "";
}
// The folder menu: no folder, recent projects, or pick one. Fixed once the chat has started.
function fillFolders() {
  const sel = $("#folder"), c = D.chat, cur = (c && c.folder) || "", started = !!(c && c.messages.length);
  sel.replaceChildren();
  const none = el("option", null, "No folder"); none.value = ""; sel.append(none);
  const list = D.projects || [];
  if (cur && !list.some((p) => p.path === cur)) list.unshift({ path: cur, name: folderName(cur) });
  list.forEach((p) => { const o = el("option", null, "📁 " + p.name); o.value = p.path; o.title = p.path; sel.append(o); });
  if (!started) { const pick = el("option", null, "Choose Folder…"); pick.value = "__pick"; sel.append(pick); }
  sel.value = cur;
  sel.disabled = started;
  sel.title = started ? (cur ? "This chat works in " + cur : "This chat has no project folder: start a new chat to pick one") : "The project folder the agent works in";
  sel.style.display = started && !cur ? "none" : "";
}
function setOpt(k, v) {
  const c = D.chat;
  if (c && c.messages.length) cmd({ cmd: "set_chat_options", chat: c.id, [k]: v }); else pending[k] = v;
  if (c) c[k] = v;
}
function renderControls() {
  const sel = $("#agent"); sel.replaceChildren();
  (D.agents || []).forEach((a) => { const o = el("option", null, a); o.value = a; sel.append(o); });
  sel.value = chatOpt("agent", "") || D.default_agent;
  fillModels(chatOpt("model", "") || "");
  $("#effort").value = chatOpt("effort", "") || D.default_effort || "";
  fillFolders();
  $("#plan").style.display = D.plan_button ? "" : "none";
  $("#hint").textContent = D.composer_hint ? "↵ send · ⇧↵ new line" : "";
  const access = chatOpt("access", "") || D.default_access || "full";
  $("#access").value = access; $("#access").className = "ctl " + access;
  $("#plan").classList.toggle("on", !!chatOpt("plan", false));
  $("#agentBadge").textContent = sel.value;
  const f = D.chat && D.chat.folder, pb = $("#projBadge");
  pb.style.display = f ? "" : "none"; pb.replaceChildren();
  if (f) {
    pb.append(el("b", null, folderName(f)));
    const wt = D.worktree, br = (D.changes && D.changes.branch) || (wt && wt.branch);
    if (br) pb.append(" · " + br);
    pb.title = wt ? `Its own worktree of ${f}, on branch ${wt.branch} (made from ${wt.base}):\n${wt.path}` : f;
  }
  $("#termBtn").style.display = f && D.terminal ? "" : "none";
  $("#input").placeholder = f ? "Ask for a change, a fix, or anything about " + folderName(f) + "…" : "Ask anything, or ask for something to be done…";
  const q = (D.chat && D.chat.queue) || [], qe = $("#queue");
  qe.style.display = q.length ? "block" : "none"; qe.replaceChildren();
  q.forEach((t) => qe.append(el("div", null, "Queued · " + t)));
}
let tick = 0;
function renderWorking() {
  clearInterval(tick);
  const w = $("#working");
  if (!D.running || !D.started) { w.textContent = ""; return; }
  const show = () => { const s = Math.max(0, Math.floor(Date.now() / 1000 - D.started)); w.textContent = `Working ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  show(); tick = setInterval(show, 1000);
}
let shownChat = null;
function renderAll() {
  const c = D.chat;
  const switched = (c && c.id) !== shownChat;
  if (switched) { shownChat = c && c.id; opened.clear(); closePane(); clearAttachments(); }
  $("#title").textContent = c && c.title ? c.title : "New chat";
  renderControls(); renderWorking(); renderPlanNow();
  const btn = $("#send");
  btn.classList.toggle("stop", !!D.running); btn.textContent = D.running ? "■" : "↑"; btn.title = D.running ? "Stop (type to queue a message instead)" : "Send";
  const follow = atBottom();
  renderLog();
  $("#scroll").style.paddingBottom = Math.max(220, $("#composer").offsetHeight + 60) + "px";
  if (follow || switched) toBottom();
}

// ---------- attachments (pasted or dropped images) ----------
const thumbs = {}; // path -> data URL, for this session's thumbnails
let attachments = [], waiting = {};
function clearAttachments() { attachments = []; drawAttachments(); }
function drawAttachments() {
  const box = $("#attach"); box.replaceChildren();
  box.style.display = attachments.length ? "flex" : "none";
  attachments.forEach((p) => {
    const c = el("div", "file"), img = el("img"); img.src = thumbs[p]; c.append(img, el("span", null, p.split("/").pop()));
    const x = el("span", "rm", "✕"); x.title = "Remove"; x.onclick = () => { attachments = attachments.filter((a) => a !== p); drawAttachments(); };
    c.append(x); box.append(c);
  });
}
function attachFile(file) {
  if (!/^image\/(png|jpeg|gif|webp)$/.test(file.type)) return;
  const r = new FileReader();
  r.onload = () => {
    const url = String(r.result), key = Math.random().toString(36).slice(2);
    waiting[key] = url;
    send({ t: "attach", key, mime: file.type, data: url.slice(url.indexOf(",") + 1) });
  };
  r.readAsDataURL(file);
}
$("#input").addEventListener("paste", (e) => {
  const files = [...(e.clipboardData && e.clipboardData.files || [])].filter((f) => f.type.startsWith("image/"));
  if (files.length) { e.preventDefault(); files.forEach(attachFile); }
});
const box = $("#box");
box.addEventListener("dragover", (e) => { e.preventDefault(); box.classList.add("drop"); });
box.addEventListener("dragleave", () => box.classList.remove("drop"));
box.addEventListener("drop", (e) => { e.preventDefault(); box.classList.remove("drop"); [...(e.dataTransfer.files || [])].forEach(attachFile); });

function submit(text) {
  text = (text ?? $("#input").value).trim();
  if (!text && !attachments.length) return;
  // While the agent works, a message waits in the queue and goes when it's done.
  const fresh = !(D.chat && D.chat.messages.length);
  cmd({ cmd: "send_chat", chat: D.chat ? D.chat.id : null, text, agent: $("#agent").value, files: attachments,
        ...(fresh ? { model: $("#model").value, effort: $("#effort").value, access: $("#access").value, plan: $("#plan").classList.contains("on") } : {}) });
  pending = {};
  if (text === $("#input").value.trim()) { $("#input").value = ""; grow(); }
  clearAttachments();
}
function grow() { const t = $("#input"); t.style.height = "auto"; t.style.height = Math.min(220, t.scrollHeight) + "px"; }

$("#input").addEventListener("input", grow);
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
});
$("#send").onclick = () => (D.running && !$("#input").value.trim() ? cmd({ cmd: "stop_chat", chat: D.chat && D.chat.id }) : submit());
// The composer's selects open a menu drawn in the page (the system popup can't be styled); the select keeps the value.
let menu = null;
function closeMenu() { if (menu) { menu.el.remove(); menu = null; } }
function openMenu(sel) {
  closeMenu();
  const box = el("div"), items = [];
  box.id = "menu";
  const add = (o) => {
    const it = el("div", "it" + (o.value === sel.value ? " cur" : ""), o.textContent);
    if (o.title) it.title = o.title;
    it.onmouseenter = () => hilite(items.indexOf(it));
    it.onmousedown = (e) => e.preventDefault();
    it.onclick = () => pick(o.value);
    items.push(it); box.append(it);
  };
  for (const c of sel.children) {
    if (c.tagName === "OPTGROUP") { box.append(el("div", "grp", c.label)); [...c.children].forEach(add); } else add(c);
  }
  const pick = (v) => { closeMenu(); sel.focus(); if (v !== sel.value) { sel.value = v; sel.dispatchEvent(new Event("change")); } };
  const hilite = (i) => { items.forEach((x, j) => x.classList.toggle("hi", j === i)); menu.hi = i; if (items[i]) items[i].scrollIntoView({ block: "nearest" }); };
  document.body.append(box);
  menu = { el: box, sel, items, pick, hilite, hi: -1 };
  // Above the control when there's more room there (the composer sits at the bottom), else below.
  const r = sel.getBoundingClientRect(), up = r.top > innerHeight - r.bottom;
  box.style.maxHeight = Math.min(innerHeight * 0.5, (up ? r.top : innerHeight - r.bottom) - 12) + "px";
  box.style.left = Math.max(8, Math.min(r.left, innerWidth - box.offsetWidth - 8)) + "px";
  box.style.top = (up ? r.top - box.offsetHeight - 6 : r.bottom + 6) + "px";
  box.classList.toggle("up", !up);
  hilite(Math.max(0, items.findIndex((x) => x.classList.contains("cur"))));
  requestAnimationFrame(() => box.classList.add("on"));
}
document.querySelectorAll("select.ctl").forEach((sel) => {
  sel.addEventListener("mousedown", (e) => { e.preventDefault(); if (sel.disabled) return; menu && menu.sel === sel ? closeMenu() : (sel.focus(), openMenu(sel)); });
  sel.addEventListener("keydown", (e) => {
    if (!menu && [" ", "Enter", "ArrowDown", "ArrowUp"].includes(e.key)) { e.preventDefault(); openMenu(sel); }
  });
});
// While a menu is open it gets the keys first (so Esc closes it, not the floating chat).
addEventListener("keydown", (e) => {
  if (!menu) return;
  const n = menu.items.length;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") menu.hilite((menu.hi + (e.key === "ArrowDown" ? 1 : n - 1)) % n);
  else if (e.key === "Enter" || e.key === " ") { const o = [...menu.sel.options][menu.hi]; if (o) menu.pick(o.value); }
  else if (e.key === "Escape" || e.key === "Tab") { closeMenu(); if (e.key === "Tab") return; }
  else return;
  e.preventDefault(); e.stopImmediatePropagation();
}, true);
addEventListener("mousedown", (e) => { if (menu && !menu.el.contains(e.target) && e.target !== menu.sel) closeMenu(); });
addEventListener("blur", closeMenu);
addEventListener("resize", closeMenu);
$("#agent").onchange = () => { $("#agentBadge").textContent = $("#agent").value; setOpt("agent", $("#agent").value); fillModels(""); };
$("#model").onchange = () => { setOpt("model", $("#model").value); fillEfforts(); };
$("#effort").onchange = () => setOpt("effort", $("#effort").value);
$("#access").onchange = () => { $("#access").className = "ctl " + $("#access").value; setOpt("access", $("#access").value); };
$("#plan").onclick = () => { const on = !$("#plan").classList.contains("on"); $("#plan").classList.toggle("on", on); setOpt("plan", on); };
$("#folder").onchange = () => {
  const v = $("#folder").value, id = D.chat ? D.chat.id : null;
  if (v === "__pick") { $("#folder").value = (D.chat && D.chat.folder) || ""; cmd({ cmd: "pick_chat_folder", chat: id }); }
  else cmd({ cmd: "set_chat_folder", chat: id, folder: v });
};
// Links open as tabs; the chat itself never navigates.
document.addEventListener("click", (e) => {
  const a = e.target.closest && e.target.closest("a[href]");
  if (a) { e.preventDefault(); cmd({ cmd: "new_tab", url: a.href }); }
});

const upd = new Set();
function flushUpdates() {
  upd.raf = 0;
  if (!D || !D.chat) return upd.clear();
  const follow = atBottom();
  for (const i of upd) {
    const m = D.chat.messages[i], old = document.querySelector(`.msg[data-i="${i}"]`);
    if (!m) continue;
    const fresh = msgEl(m, i, D.running && i === D.chat.messages.length - 1);
    if (old) old.replaceWith(fresh); else { renderLog(); break; }
  }
  upd.clear();
  renderPlanNow();
  if (follow) toBottom();
}

window.chat = {
  render(d) {
    D = d;
    upd.clear();
    const r = document.documentElement;
    r.classList.toggle("light", d.theme.mode === "light");
    const f = d.float;
    r.classList.toggle("float", !!f); r.classList.toggle("hints", !!(f && f.hints));
    if (!f) { r.classList.remove("leaving"); leaving = false; }
    if (f) { r.style.setProperty("--fw", f.width + "px"); r.style.setProperty("--ftop", f.top + "%"); r.style.setProperty("--fdim", f.dim); }
    r.style.setProperty("--accent", d.theme.accent);
    if (d.theme.mode !== "light") r.style.setProperty("--bg", "color-mix(in srgb, " + d.theme.background[0] + " 45%, #121117)"); else r.style.removeProperty("--bg");
    document.body.style.fontFamily = d.font ? `${d.font}, -apple-system, system-ui, sans-serif` : "";
    renderAll();
  },
  // One message changed while streaming: redraw just that one, at most once a frame (tokens arrive faster than
  // that, and each redraw re-reads the whole message), and keep following the bottom if we were there.
  update(i, m, running) {
    if (!D || !D.chat) return;
    D.chat.messages[i] = m; D.running = running;
    upd.add(i);
    if (!upd.raf) upd.raf = requestAnimationFrame(flushUpdates);
  },
  // Valerie saved a pasted image: it goes with the next message.
  attached(path, key) {
    if (!waiting[key]) return;
    thumbs[path] = waiting[key]; delete waiting[key];
    attachments.push(path); drawAttachments(); $("#input").focus();
  },
  showDiff(path, text) {
    if (!$("#pane").classList.contains("on")) return;
    const wrap = $("#paneDiff"); wrap.replaceChildren();
    if (!text.trim()) { wrap.append(el("div", "loading", "No changes.")); return; }
    paneFiles = gitDiffView(text, wrap);
    if (paneFocus && paneFiles[paneFocus]) requestAnimationFrame(() => paneFiles[paneFocus].scrollIntoView({ block: "start" }));
  },
  focus() { $("#input").focus(); },
  // Text from elsewhere (the terminal's Ask Agent) goes into the composer, ready for a question.
  insert(text) {
    const t = $("#input"), v = t.value.trim();
    t.value = (v ? v + "\n\n" : "") + text + "\n";
    grow(); t.focus(); t.setSelectionRange(t.value.length, t.value.length);
  },
};
$("#toChats").onclick = () => leaveFloat(true);
$("#termBtn").onclick = () => cmd({ cmd: "open_terminal", chat: D.chat && D.chat.id });
send({ t: "ready" });
</script>
