<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --bg1: #171a2b; --bg2: #2a1f3d; --accent: #9d8cff; --fg: #ecebf5;
  --fg-dim: rgba(236,235,245,.55); --hover: rgba(255,255,255,.07); --active: rgba(255,255,255,.14);
  --line: rgba(255,255,255,.08); --sw: 248px; --tile: rgba(255,255,255,.06); --ease: cubic-bezier(.2,.8,.2,1);
}
:root.light {
  --fg: #23201c; --fg-dim: rgba(35,32,28,.5); --hover: rgba(0,0,0,.05); --active: rgba(255,255,255,.75);
  --line: rgba(0,0,0,.08); --tile: rgba(255,255,255,.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  color: var(--fg); background: linear-gradient(160deg, var(--bg1), var(--bg2));
  -webkit-user-select: none; user-select: none; cursor: default;
}
body::before { /* soft accent glow */
  content: ""; position: fixed; inset: 0; pointer-events: none; transition: background .35s;
  background: radial-gradient(600px 400px at 0% 100%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%);
}
.bgfade { position: fixed; inset: 0; pointer-events: none; transition: opacity .4s ease; }
/* window.vibrancy: the desktop shows through, frosted, behind a lighter wash of the theme */
html.vibrant body { background: linear-gradient(160deg, color-mix(in srgb, var(--bg1) 58%, transparent), color-mix(in srgb, var(--bg2) 58%, transparent)); }
html.vibrant { background: transparent; }
#sidebar { position: fixed; top: 0; bottom: 0; width: var(--sw); display: flex; flex-direction: column; padding: 0 8px 8px; transition: opacity .12s; }
#sidebar.hidden { opacity: 0; transition: opacity .15s .2s; }
body.right #sidebar { right: 0; }
body.left #sidebar { left: 0; }
.drag { height: 40px; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 2px; padding-left: 76px; }
body.right .drag { padding-left: 0; justify-content: flex-start; }
.navbtn { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: var(--fg-dim); font-size: 15px; }
body.pointer .navbtn:hover { background: var(--hover); color: var(--fg); }
.navbtn.off { opacity: .35; pointer-events: none; }
#url {
  height: 34px; flex: none; border-radius: 10px; background: var(--tile); display: flex; align-items: center;
  padding: 0 11px; gap: 7px; color: var(--fg-dim); font-size: 12.5px; margin-bottom: 10px; overflow: hidden; white-space: nowrap;
}
body.pointer #url:hover { background: var(--active); color: var(--fg); }
#url b { color: var(--fg-dim); font-weight: 500; }
body.pointer #url:hover b { color: var(--fg); }
#url .path { opacity: .6; }
#url .lock { font-size: 10px; opacity: .7; }
#url .insecure { font-size: 11px; color: #ff9a6b; opacity: .85; }
.grid { display: grid; grid-template-columns: repeat(var(--pin-cols, 4), 1fr); gap: 7px; margin-bottom: 10px; flex: none; }
#favorites:empty { display: none; }
body.dragging #favorites:empty { display: block; height: 46px; border-radius: 11px; border: 1.5px dashed var(--line); }
body.dragging #favorites:empty::after { content: "Drop here to favorite"; display: grid; place-items: center; height: 100%; color: var(--fg-dim); font-size: 11.5px; }
.tile { height: var(--pin-h, 46px); border-radius: 11px; background: var(--tile); display: grid; place-items: center; position: relative; transition: background .12s, transform .12s; }
body.pointer .tile:hover { background: var(--active); }
.tile.active { background: var(--active); box-shadow: 0 0 0 1.5px var(--accent) inset; }
.tile img, .tile .letter { width: 20px; height: 20px; }
.tile.unloaded img, .tile.unloaded .letter { filter: grayscale(.35); opacity: .7; }
.tile .audio { position: absolute; right: 5px; top: 3px; font-size: 9px; color: var(--accent); }
#scroll { flex: 1; overflow-y: auto; overflow-x: hidden; margin: 0 -4px; padding: 0 4px; will-change: transform; }
#scroll::-webkit-scrollbar { width: 0; }
.space-title { display: flex; align-items: center; gap: 8px; padding: 2px 8px 8px; font-weight: 600; font-size: 13px; }
.space-title .icon { color: var(--accent); }
/* tab rows: sidebar.tab_height sets --tab-h; text, icon and corners scale with it */
:root { --tab-h: 38px; --tab-icon: 16px; --tab-font: 13px; }
.row {
  height: var(--tab-h); border-radius: calc(var(--tab-h) * .26); font-size: var(--tab-font); display: flex; align-items: center; gap: 9px; padding: 0 6px 0 10px;
  position: relative; color: var(--fg); transition: background .12s;
}
body.pointer .row:hover { background: var(--hover); }
.row.active { background: var(--active); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
:root.light .row.active { box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.row .title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.row.unloaded .title { color: var(--fg-dim); }
.row img.ico, .row .letter { width: var(--tab-icon); height: var(--tab-icon); border-radius: calc(var(--tab-icon) * .25); }
.row .letter { font-size: calc(var(--tab-icon) * .62); }
.row .x { width: min(22px, calc(var(--tab-h) * .65)); height: min(22px, calc(var(--tab-h) * .65)); border-radius: 6px; display: none; place-items: center; color: var(--fg-dim); font-size: 14px; }
body.pointer .row:hover .x { display: grid; }
body.pointer.dragging .row:hover .x { display: none; }
body.pointer.dragging .row:not(.active):not(.dragging-src):hover { background: transparent; }
body.pointer .row .x:hover { background: var(--hover); color: var(--fg); }
.row .x.minus { font-size: 15px; font-weight: 600; }
.tile .x.minus { position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; display: none; place-items: center;
  font-size: 12px; font-weight: 700; line-height: 1; color: var(--fg); background: var(--active); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
body.pointer .tile:hover .x.minus { display: grid; } body.pointer .tile .x.minus:hover { background: var(--accent); color: #fff; }
.row .audio { font-size: calc(var(--tab-font) * .85); color: var(--accent); }
.row.split::after { content: ""; position: absolute; left: 2px; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--accent); }
img.ico, .letter { width: 16px; height: 16px; flex: none; border-radius: 4px; }
.letter { display: grid; place-items: center; font-size: 10px; font-weight: 700; background: var(--accent); color: #fff; }
.loading img.ico, .loading .letter, .tile.loading img { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.folder > .row .chev { width: 16px; text-align: center; color: var(--fg-dim); font-size: 10px; transition: transform .15s; }
.folder.open > .row .chev { transform: rotate(90deg); }
.folder .kids { padding-left: 14px; display: none; }
.folder.open > .kids { display: block; }
.divider { display: flex; align-items: center; margin: 10px 4px 6px; color: var(--fg-dim); font-size: 11px; min-height: 14px; }
.divider span { padding: 0 8px; white-space: nowrap; }
.divider::before, .divider::after { content: ""; height: 1px; background: var(--line); flex: 1; }
body.pointer .divider span:hover { color: var(--fg); }
.divider .hover { max-width: 0; padding: 0; opacity: 0; overflow: hidden; transition: opacity .15s, max-width .15s, padding .15s; }
body.pointer .divider:hover .hover { max-width: 80px; padding: 0 8px; opacity: 1; }
.newtab { color: var(--fg-dim); }
.newtab .plus { width: 16px; text-align: center; font-size: 16px; }
.empty-pinned { color: var(--fg-dim); font-size: 11.5px; padding: 10px; border-radius: 10px; border: 1.5px dashed var(--line); text-align: center; margin-bottom: 4px; }
#bottom { flex: none; display: flex; align-items: center; justify-content: center; gap: 4px; padding-top: 8px; position: relative; }
.sp { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--fg-dim); font-size: 13px; transition: background .15s, color .15s; }
body.pointer .sp:hover { background: var(--hover); color: var(--fg); }
.sp.active { color: var(--fg); background: var(--hover); }
.agents { position: absolute; left: 4px; display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--fg-dim); }
.agents i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
/* drag and drop */
/* kept section: a list under the pinned icons */
.kept { margin-top: 2px; }
.kept.empty { display: none; }
body.dragging .kept.empty { display: block; }
.kept-hint { color: var(--fg-dim); font-size: 11.5px; padding: 9px 10px; border-radius: 10px; border: 1.5px dashed var(--line); text-align: center; margin: 4px 0; }
.ficon { width: 16px; text-align: center; font-size: 12px; flex: none; }
.folder > .row .chev { display: none; }
/* resize handle on the sidebar's inner edge */
#resize { position: absolute; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 5; }
body.left #resize { right: 0; }
body.right #resize { left: 0; }
body.pointer #resize:hover, body.resizing #resize { background: linear-gradient(90deg, transparent 2px, color-mix(in srgb, var(--accent) 55%, transparent) 2px, transparent 5px); }
body.resizing, body.resizing * { cursor: col-resize !important; user-select: none; }
/* medium: icon + domain; tiles three across */
body.size-medium .grid { grid-template-columns: repeat(3, 1fr); }
body.size-medium #url .path { display: none; }
/* compact: icons only, one column */
body.size-compact #sidebar { padding: 0 6px 8px; }
body.size-compact .drag { padding-left: 0; justify-content: center; }
body.size-compact .navbtn, body.size-compact #url, body.size-compact .space-title, body.size-compact .divider span,
body.size-compact .row .title, body.size-compact .row .x, body.size-compact .row .audio, body.size-compact .kept-hint,
body.size-compact .empty-pinned { display: none; }
body.size-compact .grid { grid-template-columns: 1fr; gap: 6px; }
body.size-compact .tile { height: 40px; }
body.size-compact .row { justify-content: center; padding: 0; gap: 0; }
body.size-compact .row img.ico, body.size-compact .row .letter { width: calc(var(--tab-icon) + 2px); height: calc(var(--tab-icon) + 2px); }
body.size-compact .folder .kids { padding-left: 0; }
body.size-compact .folder.open > .kids { border-left: 2px solid var(--line); margin-left: 4px; }
body.size-compact #bottom { flex-direction: column; gap: 4px; }
body.size-compact .agents span { display: none; }
body.size-compact .agents { position: static; }
.audio { cursor: pointer; }
.audio.muted { opacity: .5; text-decoration: line-through; }
/* mini player for media playing in another tab */
#nowplaying { display: flex; align-items: center; gap: 2px; margin: 6px 0 4px; padding: 4px; border-radius: 11px; background: var(--tile); flex: none; }
#nowplaying .np-tab { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; padding: 4px 6px; border-radius: 8px; }
#nowplaying .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
.np-btn { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; color: var(--fg-dim); flex: none; }
body.pointer .np-btn:hover, body.pointer #nowplaying .np-tab:hover { background: var(--hover); color: var(--fg); }
.np-btn svg { width: 14px; height: 14px; }
.np-btn svg.fill { fill: currentColor; stroke: none; }
.np-btn svg.line { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
body.size-compact #nowplaying { flex-direction: column; }
body.size-compact #nowplaying .title { display: none; }
/* the Chats space */
.chat-label { font-size: 11px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--fg-dim); padding: 12px 10px 4px; }
.chat-ic { width: var(--tab-icon); height: var(--tab-icon); flex: none; display: grid; place-items: center; color: var(--accent); font-size: calc(var(--tab-icon) * .8); }
.chat-ic.running { border: 2px solid color-mix(in srgb, var(--accent) 30%, transparent); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.row.chat .when { font-size: 11px; color: var(--fg-dim); flex: none; font-variant-numeric: tabular-nums; }
.row.chat.unread .title { font-weight: 650; }
.row.chat .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; margin-right: 4px; }
body.pointer .row.chat:hover .dot { display: none; }
.chat-label.fold { cursor: default; }
.chat-label.project { display: flex; align-items: center; gap: 6px; text-transform: none; letter-spacing: 0; font-size: 11.5px; }
.chat-label.project .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-label.project .name::before { content: "▤ "; opacity: .6; }
.chat-label.project .add { opacity: 0; font-size: 14px; line-height: 1; padding: 0 4px; border-radius: 5px; cursor: default; }
body.pointer .chat-label.project:hover .add { opacity: .7; } body.pointer .chat-label.project .add:hover { opacity: 1; background: var(--hover, rgba(127,127,127,.15)); }
.row.chat .when.asking { color: #f0b45a; font-weight: 600; }
.chat-label.fold::before { content: "▾ "; } .chat-label.fold.closed::before { content: "▸ "; }
body.pointer .chat-label.fold:hover { color: var(--fg); }
#scroll.chats { display: flex; flex-direction: column; }
#scroll.chats > * { flex: none; }
.working-shelf { margin-top: auto !important; position: sticky; bottom: 0; margin: 10px -4px 0; padding: 0 4px 6px; border-top: 1px solid var(--line);
  background: linear-gradient(color-mix(in srgb, var(--bg2) 92%, transparent), var(--bg2)); backdrop-filter: blur(8px); }
body.pointer .row.chat:hover .when { display: none; }
.sp.chats-sp { color: var(--accent); }
.row.closed-chat .title, .row.closed-chat .chat-ic { opacity: .6; }
.row.closed-chat:hover .title { opacity: 1; }
.row.closed-chat .when.proj { max-width: 34%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 6px; }
body.size-compact .chat-label, body.size-compact .row.chat .when { display: none; }
/* icons-only sidebar: pinned tabs tucked into one folder tile that opens a column on hover */
.pinfolder .mini { display: grid; grid-template-columns: repeat(2, 12px); gap: 3px; }
.pinfolder .mini img, .pinfolder .mini .letter { width: 12px; height: 12px; border-radius: 3px; font-size: 7px; }
.pinfolder.open { background: var(--active); }
.pinfolder .glyph { width: 18px; height: 18px; fill: none; stroke: var(--fg-dim); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pinfolder.active .glyph, .pinfolder.open .glyph { stroke: var(--fg); }
#pinfly { position: fixed; z-index: 9; display: none; padding: 4px; border-radius: 13px; overflow-y: auto; border: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg1) 92%, #000); box-shadow: 0 10px 26px rgba(0,0,0,.35); }
:root.light #pinfly { background: #fbfaf8; }
#pinfly.open { display: block; }
#pinfly::-webkit-scrollbar { width: 0; }
#pinfly .grid { margin-bottom: 0; }
.ghost { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; opacity: .97; box-shadow: 0 10px 28px rgba(0,0,0,.35);
  background: color-mix(in srgb, var(--bg2) 88%, #fff); border-radius: 10px; }
/* where the dragged tab will land: an empty slot the others slide around */
.dragging-src { background: color-mix(in srgb, var(--accent) 14%, transparent) !important; border-radius: 10px; }
.dragging-src > * { opacity: 0; }
.ghost { transition: none; }
body.dragging, body.dragging * { cursor: grabbing !important; }
.drop-before::before, .drop-after::after { content: ""; position: absolute; left: 6px; right: 6px; height: 2px; border-radius: 2px; background: var(--accent); z-index: 2; }
.drop-before::before { top: -1px; }
.drop-after::after { bottom: -1px; }
.tile.drop-before::before, .tile.drop-after::after { left: auto; right: auto; top: 6px; bottom: 6px; width: 2px; height: auto; }
.tile.drop-before::before { left: -5px; }
.tile.drop-after::after { right: -5px; }
.drop-into { background: color-mix(in srgb, var(--accent) 28%, transparent) !important; }
#menu {
  position: fixed; min-width: 190px; background: color-mix(in srgb, var(--bg1) 92%, #000); border: 1px solid var(--line);
  border-radius: 10px; padding: 5px; box-shadow: 0 12px 32px rgba(0,0,0,.4); display: none; z-index: 10; color: var(--fg);
}
:root.light #menu { background: #fbfaf8; }
#menu div { padding: 6px 10px; border-radius: 6px; }
body.pointer #menu div:hover { background: var(--accent); color: #fff; }
#menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
#toast {
  position: fixed; bottom: 54px; left: 12px; width: calc(var(--sw) - 24px); padding: 9px 12px; border-radius: 10px;
  background: var(--accent); color: #fff; font-weight: 500; opacity: 0; transform: translateY(6px); transition: .2s; pointer-events: none;
}
body.right #toast { left: auto; right: 12px; }
#toast.show { opacity: 1; transform: none; }
#empty { position: fixed; top: 0; bottom: 0; right: 0; display: grid; place-items: center; text-align: center; transition: left .2s var(--ease), right .2s var(--ease); }
#empty h1 { font-size: 44px; font-weight: 700; letter-spacing: -1.5px; opacity: .9; }
#empty h1 span { color: var(--accent); }
#empty svg { width: 84px; height: 84px; opacity: .22; }
#empty iframe { width: 100%; height: 100%; border: 0; display: block; }
/* plugin widgets: buttons and live text from plugins' `sidebar` entries */
#widgets { flex: none; display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
#widgets:empty { display: none; }
.widget { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 5px 10px; border-radius: 9px; background: var(--tile); color: var(--fg); font-size: 12.5px; }
.widget .wicon { width: 16px; text-align: center; flex: none; }
.widget .wtext { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.widget.clickable { cursor: pointer; }
body.pointer .widget.clickable:hover { background: var(--active); }
body.size-compact .widget .wtext { display: none; }
body.size-compact .widget { justify-content: center; padding: 5px 0; }
kbd { font: 12px -apple-system, system-ui; padding: 2px 6px; border-radius: 5px; background: var(--tile); border: 1px solid var(--line); }
/* top tab bar mode */
#topbar { display: none; position: fixed; top: 0; left: 0; right: 0; height: 40px; align-items: center; gap: 6px; padding: 0 8px 0 80px; }
body.top #sidebar { display: none; }
body.top #topbar { display: flex; }
#topbar .chip { height: 28px; max-width: 200px; min-width: 40px; border-radius: 8px; display: flex; align-items: center; gap: 7px; padding: 0 9px; }
body.pointer #topbar .chip:hover { background: var(--hover); }
#topbar .chip.active { background: var(--active); }
#topbar .chip .title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#topbar .spc { font-weight: 600; padding: 0 8px; color: var(--accent); }
#topbar .tabs { display: flex; gap: 3px; flex: 1; overflow: hidden; }
.ask { position: fixed; left: 12px; top: 90px; width: calc(var(--sw) - 24px); padding: 10px; border-radius: 12px; z-index: 20;
  background: color-mix(in srgb, var(--bg1) 94%, #000); border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(0,0,0,.4); font-size: 12px; color: var(--fg-dim); }
:root.light .ask { background: #fbfaf8; }
.ask input { width: 100%; margin-top: 6px; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--tile);
  color: var(--fg); font: inherit; font-size: 13px; outline: none; }
.ask input:focus { border-color: var(--accent); }
</style>
</head>
<body class="left">
<div id="sidebar">
  <div class="drag" id="drag">
    <div class="navbtn" id="back" title="Back">‹</div>
    <div class="navbtn" id="fwd" title="Forward">›</div>
    <div class="navbtn" id="reload" title="Reload">↻</div>
  </div>
  <div id="url"></div>
  <div id="favorites" class="grid"></div>
  <div id="widgets"></div>
  <div id="scroll"></div>
  <div id="nowplaying"></div>
  <div id="bottom"></div>
  <div id="resize"></div>
</div>
<div id="topbar"></div>
<div id="empty"></div>
<div id="menu"></div>
<div id="pinfly"></div>
<div id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
const send = (o) => window.ipc.postMessage(JSON.stringify(o));
const cmd = (c) => send({ t: "cmd", cmd: c });
let S = null, prevSpace = null, prevTheme = null, pendingDir = 0, suppressClick = false;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function host(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u || ""; } }
// Each tab's icon element is kept and moved into the new sidebar on every render, so it never reloads or flickers.
// Favicons that failed to load show the letter straight away instead of retrying.
const badIcons = new Set(), iconNodes = new Map();
let iconsUsed = new Set();
function icon(t, cls = "ico", slot = "side") {
  const ch = (host(t.url)[0] || "•").toUpperCase(), letter = () => el("div", "letter", ch);
  const src = t.favicon || (/^https?:/.test(t.url) ? new URL("/favicon.ico", t.url).href : null);
  const key = t.id + " " + cls + " " + slot, hit = iconNodes.get(key);
  if (hit && hit.src === src && hit.ch === ch) {
    if (iconsUsed.has(key)) return hit.node.cloneNode(true);
    iconsUsed.add(key); return hit.node;
  }
  let node;
  if (!src || badIcons.has(src)) node = letter();
  else {
    node = el("img", cls); node.src = src; node.draggable = false;
    node.onerror = () => { badIcons.add(src); const l = letter(); node.replaceWith(l); const h = iconNodes.get(key); if (h && h.node === node) h.node = l; };
  }
  iconNodes.set(key, { src, ch, node }); iconsUsed.add(key);
  return node;
}
// mouse.middle_click_tab: a command that acts on the tab (null = nothing).
function middleClick(t) {

    // Crossfade: freeze the old gradient on top, then fade it out.
    const cs = getComputedStyle(root), old = el("div", "bgfade");
    old.style.background = `linear-gradient(160deg, ${cs.getPropertyValue("--bg1")}, ${cs.getPropertyValue("--bg2")})`;
    document.body.prepend(old);

    setTimeout(() => old.remove(), 450);
  }
  prevTheme = key;
  root.classList.toggle("light", th.mode === "light");
  root.style.setProperty("--bg1", th.background[0]);
  root.style.setProperty("--bg2", th.background[1] || th.background[0]);
  root.style.setProperty("--accent", th.accent);
  if (th.foreground) root.style.setProperty("--fg", th.foreground); else root.style.removeProperty("--fg");
}

// The new space's list slides in from the side it came from. It never starts invisible, so swiping fast through

function slideIn(dir) {

  if (!ms) { sc.style.transition = "none"; sc.style.transform = ""; sc.style.opacity = ""; return; }
  sc.style.transition = "none";

  sc.offsetWidth; // reflow so the transition starts from the offset

// ---------- two-finger swipe between spaces: the list follows your fingers, then commits or springs back ----------
// A trackpad keeps sending fading momentum after a swipe, which is ignored. Momentum only ever fades, so a new swipe
// (fast ones included, while the last one's momentum is still coming) shows as a turn, a long pause, or two events in
// a row well above the smallest momentum seen. Events that arrive late are several merged ones (the sidebar was busy),
// so they're scaled back rather than read as a push.
const swipe = { acc: 0, timer: 0, lock: 0, low: 0, armed: false, strong: false, prev: 0, last: 0, at: 0 };
function springBack() {
  const sc = $("#scroll");
  sc.style.transition = "transform .2s var(--ease), opacity .16s"; sc.style.transform = "translateX(0)"; sc.style.opacity = "1";
}
$("#sidebar").addEventListener("wheel", (e) => {
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY) || !S || (S.spaces.length < 2 && !(S.chats && S.chats.enabled)) || S.sidebar.swipe_between_spaces === false) return;
  const dist = Math.max(20, +S.sidebar.swipe_distance || 90);
  const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerWidth : 1, dx = e.deltaX * k, a = Math.abs(dx);
  const now = e.timeStamp || performance.now(), gap = now - swipe.at; swipe.at = now;
  if (swipe.lock) {
    const each = gap > 24 ? a * 16 / Math.min(gap, 160) : a;
    // The fingers may still be speeding up when a swipe commits: wait for the first slowdown before judging.
    if (!swipe.armed && each < swipe.last) { swipe.armed = true; swipe.low = a; }
    const turned = Math.sign(dx) !== swipe.lock && a > 1, strong = swipe.armed && each > swipe.low * 1.5 + 2;
    const fresh = gap > 300 || turned || (strong && swipe.strong);
    swipe.strong = strong; swipe.last = each;
    if (!fresh) { if (swipe.armed) swipe.low = Math.min(swipe.low, a); swipe.prev = dx; return; }
    swipe.acc = turned || gap > 300 ? 0 : swipe.prev; swipe.lock = 0;
  }
  swipe.last = a; swipe.acc += dx;
  clearTimeout(swipe.timer);
  const sc = $("#scroll");
  if (Math.abs(swipe.acc) > dist) {
    const dir = Math.sign(swipe.acc);
    Object.assign(swipe, { acc: 0, lock: dir, armed: false, strong: false });
    pendingDir = dir;
    cmd({ cmd: dir > 0 ? "next_space" : "prev_space" });
    return;
  }
  const off = Math.max(-1, Math.min(1, swipe.acc / dist));
  sc.style.transition = "none";
  sc.style.transform = `translateX(${-off * 40}px)`; sc.style.opacity = String(1 - Math.abs(off) * 0.4);
  swipe.timer = setTimeout(() => { swipe.acc = 0; springBack(); }, 140);
}, { passive: true });

// ---------- drag the sidebar's edge to resize (narrow enough and it becomes medium, then icons-only) ----------

$("#resize").addEventListener("mousedown", (e) => {

// Vim keys that act on tabs and spaces also work here (start page, sidebar focus, a tab still loading).
const PAGE_ONLY = new Set(["scroll_down", "scroll_up", "scroll_left", "scroll_right", "half_page_down", "half_page_up", "top", "bottom", "hints", "hints_new_tab", "insert", "find", "back", "forward", "reload"]);
let vimBuf = "", vimTimer = 0;
addEventListener("keydown", (e) => {
  if (!S || !S.vim || !S.vim.enabled || e.metaKey || e.ctrlKey || e.altKey || e.key.length !== 1) return;
  const a = document.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.isContentEditable)) return;
  const b = S.vim.bindings, next = vimBuf + e.key, keys = Object.keys(b).filter((k) => b[k] != null);
  clearTimeout(vimTimer);
  const fire = (v) => {

    if (!PAGE_ONLY.has(c.cmd)) cmd(c);
  };
  if (b[next] != null && !keys.some((k) => k !== next && k.startsWith(next))) { vimBuf = ""; e.preventDefault(); return fire(b[next]); }
  if (keys.some((k) => k.startsWith(next))) { vimBuf = next; vimTimer = setTimeout(() => { if (b[vimBuf] != null) fire(b[vimBuf]); vimBuf = ""; }, S.vim.key_timeout_ms || 700); return; }
  vimBuf = "";
});

function pointerOut() { if (!resizing && !(drag && drag.active)) { document.body.classList.remove("pointer"); closeFly(); } }

// Key sequences: after the first key of one, the next key pressed here goes to Valerie.
let seqUntil = 0;
addEventListener("keydown", (e) => {
  if (!seqUntil || ["Meta", "Control", "Alt", "Shift"].includes(e.key)) return;
  const live = performance.now() < seqUntil; seqUntil = 0;
  if (!live) return;
  e.preventDefault(); e.stopImmediatePropagation();
  const k = e.code.replace(/^Key/, "").replace(/^Digit/, "").replace(/^Arrow/, "");
  send({ t: "seq_key", key: [e.metaKey && "Cmd", e.ctrlKey && "Ctrl", e.altKey && "Alt", e.shiftKey && "Shift", k].filter(Boolean).join("+") });
}, true);
function nextKey() { seqUntil = performance.now() + 2000; }

window.valerie = { render, toast, pointerOut, nextKey };
send({ t: "ready" });
</script>
</body>
</html>
