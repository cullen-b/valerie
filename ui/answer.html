<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The answer to a question asked from find. It lives in Valerie's own view, not in the page, so the page can't read it. -->
<style>
:root { --accent: #9d8cff; }
html, body { margin: 0; background: rgba(24,24,32,.97); color: rgba(255,255,255,.92); overflow: hidden; }
body { font: 13px/1.55 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
#wrap { padding: 12px 14px; max-height: 100vh; overflow-y: auto; box-sizing: border-box; }
.q { color: rgba(255,255,255,.5); font-size: 12px; margin-bottom: 6px; display: flex; gap: 8px; }
.q span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q b { cursor: default; font-size: 14px; line-height: 1; }
p { margin: 0 0 8px; } ul, ol { margin: 0 0 8px; padding-left: 18px; } li { margin: 2px 0; }
code { font: 12px ui-monospace, Menlo, monospace; background: rgba(255,255,255,.08); padding: 1px 4px; border-radius: 4px; }
pre { background: rgba(255,255,255,.06); padding: 8px; border-radius: 8px; overflow-x: auto; margin: 0 0 8px; } pre code { background: none; padding: 0; }
strong { font-weight: 600; } a { color: var(--accent); text-decoration: none; }
.err { color: #ff8f8f; }
.tools { color: rgba(255,255,255,.45); font: 11.5px ui-monospace, Menlo, monospace; margin-bottom: 6px; }
.foot { margin-top: 8px; display: flex; gap: 8px; align-items: center; color: rgba(255,255,255,.45); font-size: 11.5px; }
button { all: unset; padding: 4px 9px; border-radius: 7px; background: rgba(255,255,255,.1); color: #fff; font-size: 12px; }
button:hover { background: var(--accent); }
.dots::after { content: "…"; animation: dots 1s steps(3) infinite; }
@keyframes dots { 0% { content: "."; } 33% { content: ".."; } 66% { content: "..."; } }
</style>
</head>
<body>
<div id="wrap"></div>
<script>
const send = (o) => window.ipc.postMessage(JSON.stringify(o));
const A = { q: "", text: "", tools: [], error: "", done: false, agent: "" };
let raf = 0, lastH = 0;
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function inline(text, into) {
  const re = /(`[^`]+`)|(\*\*[^*]+\*\*)|(\[[^\]]+\]\((https?:[^)\s]+)\))/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) into.append(text.slice(last, m.index));
    if (m[1]) into.append(el("code", null, m[1].slice(1, -1)));
    else if (m[2]) into.append(el("strong", null, m[2].slice(2, -2)));
    else { const a = el("a", null, m[3].slice(1, m[3].indexOf("]"))); a.href = m[4]; into.append(a); }
    last = re.lastIndex;
  }
  if (last < text.length) into.append(text.slice(last));
}
function markdown(src, into) {
  let list = null, para = null, code = null;
  for (const line of src.split("\n")) {
    if (/^```/.test(line)) { if (code) code = null; else { const pre = el("pre"); code = el("code"); pre.append(code); into.append(pre); } list = para = null; continue; }
    if (code) { code.textContent += (code.textContent ? "\n" : "") + line; continue; }
    if (!line.trim()) { list = para = null; continue; }
    const m = line.match(/^\s*([-*•]|\d+[.)])\s+(.*)/);
    if (m) { if (!list) { list = el(/\d/.test(m[1]) ? "ol" : "ul"); into.append(list); } const li = el("li"); inline(m[2], li); list.append(li); para = null; continue; }
    const h = line.match(/^#{1,3}\s+(.*)/);
    if (h) { const p = el("p"), s = el("strong"); inline(h[1], s); p.append(s); into.append(p); list = para = null; continue; }
    if (!para) { para = el("p"); into.append(para); list = null; } else para.append(el("br"));
    inline(line, para);
  }
}
function draw() {
  raf = 0;
  const w = document.getElementById("wrap"); w.replaceChildren();
  const head = el("div", "q"), x = el("b", null, "×"); x.title = "Close"; x.onclick = () => send({ t: "close" });
  head.append(el("span", null, A.q), x); w.append(head);
  if (A.tools.length) w.append(el("div", "tools", "Used " + A.tools.join(", ")));
  if (A.text) markdown(A.text, w);
  else if (!A.done && !A.error) w.append(el("div", "dots", "Reading the page"));
  if (A.error) w.append(el("div", "err", A.error));
  if (A.done && A.text) {
    const f = el("div", "foot"), go = el("button", null, "Continue in Chats");
    go.onclick = () => send({ t: "to_chat" });
    f.append(go, el("span", null, A.agent ? "Answered by " + A.agent : "")); w.append(f);
  }
  const h = Math.ceil(w.scrollHeight);
  if (h !== lastH) { lastH = h; send({ t: "height", h }); }
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") send({ t: "close" }); });
document.addEventListener("click", (e) => {
  const a = e.target.closest && e.target.closest("a[href]");
  if (a) { e.preventDefault(); send({ t: "open", url: a.href }); }
});
window.answer = {
  start(q, accent) { Object.assign(A, { q, text: "", tools: [], error: "", done: false, agent: "" }); if (accent) document.documentElement.style.setProperty("--accent", accent); lastH = 0; draw(); },
  event(ev) {
    if (ev.type === "delta") A.text += ev.text;
    else if (ev.type === "block") { if (A.text && !A.text.endsWith("\n\n")) A.text += "\n\n"; A.text += ev.text; }
    else if (ev.type === "final") { if (!A.text.trim()) A.text = ev.text; }
    else if (ev.type === "tool") A.tools.push(ev.text);
    else if (ev.type === "error") A.error = ev.text;
    else if (ev.type === "done") { A.done = true; A.agent = ev.agent || ""; }
    if (!raf) raf = requestAnimationFrame(draw);
  },
};
send({ t: "ready" });
</script>
</body>
</html>
