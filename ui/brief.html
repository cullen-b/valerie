<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Brief</title>
<style>
:root { --bg: #f7f4ee; --fg: #23201c; --dim: rgba(35,32,28,.55); --line: rgba(0,0,0,.08); --card: #fffdf9; --accent: #c2603a; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #17161b; --fg: #ecebf5; --dim: rgba(236,235,245,.55); --line: rgba(255,255,255,.08); --card: #1f1e25; --accent: #f0a073; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 760px; margin: 0 auto; padding: 56px 28px 96px; }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: var(--accent); }
h1 { font-size: 34px; line-height: 1.15; letter-spacing: -.6px; margin: 6px 0 4px; }
.meta { color: var(--dim); font-size: 13px; margin-bottom: 28px; }
.meta a { color: var(--dim); }
.summary { font-size: 19px; line-height: 1.5; padding: 18px 20px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); margin-bottom: 28px; }
h2 { font-size: 13px; letter-spacing: .6px; text-transform: uppercase; color: var(--dim); margin: 30px 0 10px; }
h3 { font-size: 16px; margin: 18px 0 6px; }
ul, ol { padding-left: 1.2em; margin: 0 0 12px; } li { margin: 6px 0; }
p { margin: 0 0 12px; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
code { font: .88em ui-monospace, Menlo, monospace; background: var(--line); padding: 1px 5px; border-radius: 5px; }
strong { font-weight: 650; }
.earlier { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--dim); font-size: 13px; }
.earlier a { margin-right: 12px; color: var(--dim); }
.err { color: #d0473a; }
</style>
</head>
<body>
<main id="m"></main>
<script>
const B = /*BRIEF*/null;
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function inline(text, into) {
  const re = /(`[^`]+`)|(\*\*[^*]+\*\*)|(\[[^\]]+\]\(((?:https?|valerie):[^)\s]+)\))|(https?:\/\/[^\s)]+)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) into.append(text.slice(last, m.index));
    if (m[1]) into.append(el("code", null, m[1].slice(1, -1)));
    else if (m[2]) into.append(el("strong", null, m[2].slice(2, -2)));
    else { const a = el("a", null, m[3] ? m[3].slice(1, m[3].indexOf("]")) : m[5]); a.href = m[4] || m[5]; into.append(a); }
    last = re.lastIndex;
  }
  if (last < text.length) into.append(text.slice(last));
}
function markdown(src, into) {
  let list = null, para = null, first = true;
  for (const line of src.replace(/\r/g, "").split("\n")) {
    if (!line.trim()) { list = para = null; continue; }
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) { const h = el(m[1].length === 1 ? "h2" : "h" + Math.min(3, m[1].length)); inline(m[2], h); into.append(h); list = para = null; first = false; continue; }
    if ((m = line.match(/^\s*([-*•]|\d+[.)])\s+(.*)/))) {
      const ordered = /\d/.test(m[1]);
      if (!list) { list = el(ordered ? "ol" : "ul"); into.append(list); }
      const li = el("li"); inline(m[2], li); list.append(li); para = null; first = false; continue;
    }
    // The first plain line is the day in one sentence.
    if (first) { const s = el("div", "summary"); inline(line, s); into.append(s); first = false; continue; }
    if (!para) { para = el("p"); into.append(para); list = null; } else para.append(el("br"));
    inline(line, para);
  }
}
const m = document.getElementById("m");
if (B) {
  document.title = "☀ " + B.name;
  m.append(el("div", "kicker", B.name), el("h1", null, B.day));
  const meta = el("div", "meta", `Written by ${B.agent} at ${B.time} · `);
  const again = el("a", null, "Write it again now"); again.href = `valerie://brief/${B.slug}?run=1`; meta.append(again);
  m.append(meta);
  const body = el("div"); markdown(B.markdown || "", body); m.append(body);
  if (B.error) m.append(el("p", "err", B.error));
  if (B.earlier && B.earlier.length) {
    const e = el("div", "earlier", "Earlier: ");
    B.earlier.forEach((d) => { const a = el("a", null, d); a.href = `valerie://brief/${B.slug}/${d}`; e.append(a); });
    m.append(e);
  }
}
</script>
</body>
</html>
