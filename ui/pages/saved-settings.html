<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Saved Settings</title>
<meta name="valerie-tools" content="list_saved_settings save_settings switch_settings delete_saved_settings">
<style>
:root { --bg: var(--v-bg, #16151c); --fg: var(--v-fg, #ecebf5); --dim: var(--v-dim, rgba(236,235,245,.62)); --line: var(--v-line, rgba(255,255,255,.12));
  --card: var(--v-card, rgba(255,255,255,.045)); --accent: var(--v-accent, #9d8cff); --danger: #ff7a7a; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 680px; margin: 0 auto; padding: 44px 32px 80px; }
h1 { font-size: 26px; font-weight: 650; letter-spacing: -.01em; margin: 0 0 6px; }
.lead { color: var(--dim); margin: 0 0 28px; max-width: 60ch; text-wrap: pretty; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 11px; cursor: default; touch-action: manipulation; }
button:hover { background: var(--card); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .55; }
button.go { border-color: color-mix(in srgb, var(--accent) 65%, transparent); }
button.quiet { border-color: transparent; color: var(--dim); }
button.quiet:hover { color: var(--danger); }
form { display: flex; gap: 8px; margin: 0 0 30px; }
input { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
input::placeholder { color: var(--dim); }
ul { list-style: none; margin: 0; padding: 0; }
li { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 6px 10px; border-radius: 10px; }
li:hover { background: var(--card); }
li .name { flex: 1; min-width: 0; font-weight: 550; overflow-wrap: anywhere; }
li.now .name::after { content: "In use"; margin-left: 10px; color: var(--accent); font-size: 12.5px; font-weight: 600; }
li .quiet { opacity: 0; }
li:hover .quiet, li:focus-within .quiet { opacity: 1; }
@media (hover: none) { li .quiet { opacity: 1; } }
.note { color: var(--dim); font-size: 12.5px; margin-top: 26px; overflow-wrap: anywhere; }
.flash:empty { display: none; }
.flash { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); max-width: min(560px, 90vw); padding: 8px 14px; border-radius: 10px;
  background: var(--fg); color: var(--bg); font-size: 13px; }
.flash.bad { background: var(--danger); color: #1a0505; }
.empty { display: block; color: var(--dim); padding: 40px 0; text-align: center; }
li.empty:hover { background: none; }
.empty b { display: block; color: var(--fg); font-size: 16px; font-weight: 600; margin-bottom: 4px; }
@media (max-width: 560px) { main { padding: 28px 16px 60px; } }
</style>
</head>
<body>
<main>
  <h1>Saved Settings</h1>
  <p class="lead">Keep your settings under a name, like your everyday set or a fun one to show people, and switch between them in one step. Each saved set is your whole settings file; your tabs, logins and history stay as they are.</p>
  <form id="save">
    <input id="name" name="name" aria-label="Name" placeholder="Name for the settings in use, e.g. Everyday…" autocomplete="off" spellcheck="false" maxlength="60">
    <button class="go" type="submit">Save</button>
  </form>
  <ul id="list"></ul>
  <p class="note" id="note"></p>
</main>
<div id="flash" class="flash" role="status" aria-live="polite"></div>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let data = { saved: [], current: null, folder: "" }, asking = null;

let flashTimer = 0;
function flash(text, bad) {
  const f = $("flash");
  f.textContent = text;
  f.className = bad ? "flash bad" : "flash";
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { f.textContent = ""; }, bad ? 7000 : 3500);
}

async function run(tool, name, button) {
  if (button) button.disabled = true;
  try {
    const r = await valerie.call(tool, { name });
    flash(r.done);
  } catch (e) {
    flash(e.message, true);
  }
  asking = null;
  load();
}

function row(n) {
  const li = el("li", n === data.current && asking !== n ? "now" : "");
  if (asking === n) {
    const yes = el("button", "go", "Delete");
    yes.addEventListener("click", () => run("delete_saved_settings", n, yes));
    const no = el("button", "", "Cancel");
    no.addEventListener("click", () => { asking = null; render(); });
    li.append(el("span", "name", "Delete “" + n + "”?"), yes, no);
    return li;
  }
  li.append(el("span", "name", n));
  const del = el("button", "quiet", "Delete");
  del.setAttribute("aria-label", "Delete " + n);
  del.addEventListener("click", () => { asking = n; render(); document.querySelector("li .go")?.focus(); });
  li.append(del);
  if (n === data.current) {
    const save = el("button", "", "Update");
    save.title = "Save the settings in use over this one";
    save.addEventListener("click", () => run("save_settings", n, save));
    li.append(save);
  } else {
    const use = el("button", "go", "Use");
    use.setAttribute("aria-label", "Use " + n);
    use.addEventListener("click", () => run("switch_settings", n, use));
    li.append(use);
  }
  return li;
}

function render() {
  const list = $("list");
  list.replaceChildren(...data.saved.map(row));
  if (!data.saved.length) {
    const none = el("li", "empty");
    none.append(el("b", "", "Nothing saved yet"), "Name the settings you use now and save them, then change things and save again under another name.");
    list.append(none);
  }
  $("note").textContent = data.folder ? "Saved in " + data.folder + ". Switching never loses settings: unsaved ones are kept as “Before …”, and Change History has every earlier state." : "";
}

$("save").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = $("name").value.trim();
  if (!name) return $("name").focus();
  $("name").value = "";
  run("save_settings", name);
});

async function load() {
  try {
    data = await valerie.call("list_saved_settings", {});
    render();
  } catch (e) {
    flash("Couldn't read the saved settings: " + e.message, true);
  }
}
valerie.on("saved_settings", load);
load();
</script>
</body>
</html>
