<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>History</title>
<meta name="valerie-tools" content="open_tab delete_history">
<style>
:root { --bg: var(--v-bg, #16151c); --fg: var(--v-fg, #ecebf5); --dim: var(--v-dim, rgba(236,235,245,.55)); --line: var(--v-line, rgba(255,255,255,.08));
  --card: var(--v-card, rgba(255,255,255,.045)); --accent: var(--v-accent, #9d8cff); --danger: #ff7a7a; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 820px; margin: 0 auto; padding: 44px 32px 80px; }
header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
h1 { font-size: 26px; font-weight: 650; letter-spacing: -.01em; margin: 0; flex: 1; }
button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; cursor: default; }
button:hover { background: var(--card); }
button.quiet { border-color: transparent; color: var(--dim); padding: 4px 8px; }
button.quiet:hover { color: var(--fg); }
button.danger { color: var(--danger); }
.search { position: relative; margin-bottom: 8px; }
.search input { width: 100%; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px 9px 34px; outline: none; }
.search input:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: .5; }
.summary { color: var(--dim); font-size: 12.5px; margin: 0 2px 22px; }
.group { margin-bottom: 22px; }
.group h2 { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 6px 10px; }
.row { display: flex; align-items: center; gap: 12px; padding: 7px 10px; border-radius: 10px; }
.row:hover { background: var(--card); }
.icon { width: 28px; height: 28px; border-radius: 8px; flex: none; display: grid; place-items: center; background: var(--card);
  border: 1px solid var(--line); font-size: 12px; font-weight: 650; color: var(--dim); overflow: hidden; }
.icon img { width: 16px; height: 16px; }
.info { flex: 1; min-width: 0; }
.title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.addr { color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { color: var(--dim); font-size: 12.5px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
.visits { display: inline-block; margin-right: 8px; padding: 0 6px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 11px; }
.actions { display: none; gap: 2px; flex: none; }
.row:hover .actions, .row:focus-within .actions { display: flex; }
.row:hover .meta { display: none; }
.actions button { border: none; padding: 3px 8px; font-size: 12.5px; color: var(--dim); }
.actions button:hover { color: var(--fg); }
.more { display: block; margin: 8px auto 0; }
.empty { text-align: center; color: var(--dim); padding: 90px 0; }
.empty b { display: block; color: var(--fg); font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.clear { display: none; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; }
header.asking .clear { display: flex; } header.asking .normal { display: none; }
</style>
</head>
<body>
<main>
  <header id="head">
    <h1>History</h1>
    <span class="normal"><button id="clear" class="quiet">Clear History…</button></span>
    <span class="clear">Forget pages from <button data-min="60">the last hour</button><button data-min="1440">today</button><button data-min="5256000" class="danger">all time</button><button id="no" class="quiet">Cancel</button></span>
  </header>
  <div class="search"><svg width="14" height="14" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="q" placeholder="Search history" autocomplete="off" spellcheck="false"></div>
  <div class="summary" id="summary"></div>
  <div id="list"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let items = [], limit = 300, opts = { group_by: "day", site_icons: true, show_visits: true, show_address: true }, timer;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function host(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (_) { return ""; } }
function shortAddr(u) { try { const x = new URL(u); return (x.hostname.replace(/^www\./, "") + x.pathname).replace(/\/$/, ""); } catch (_) { return u; } }
function dayLabel(t) {
  const d = new Date(t * 1000), today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((today - new Date(d).setHours(0, 0, 0, 0)) / 864e5);
  if (days <= 0) return "Today";
  if (days === 1) return "Yesterday";
  if (days < 7) return d.toLocaleDateString(undefined, { weekday: "long" });
  return d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: d.getFullYear() === today.getFullYear() ? undefined : "numeric" });
}
const time = (t) => new Date(t * 1000).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });

function icon(url) {
  const box = el("div", "icon"), h = host(url);
  box.textContent = (h[0] || "•").toUpperCase();
  if (opts.site_icons && /^https?:/.test(url)) {
    const img = document.createElement("img");
    img.addEventListener("load", () => box.replaceChildren(img));
    img.src = new URL("/favicon.ico", url).href;
  }
  return box;
}
async function act(tool, args, reload) {
  try { await valerie.call(tool, args); } catch (e) { $("summary").textContent = e.message; }
  if (reload) load();
}
function row(h) {
  const r = el("div", "row");
  const info = el("div", "info");
  info.append(el("div", "title", h.title || shortAddr(h.url)));
  if (opts.show_address) info.append(el("div", "addr", shortAddr(h.url)));
  const meta = el("div", "meta");
  if (opts.show_visits && h.visits > 1) meta.append(el("span", "visits", "×" + h.visits));
  meta.append(document.createTextNode(opts.group_by === "day" ? time(h.last_visit) : dayLabel(h.last_visit)));
  const actions = el("div", "actions"), site = host(h.url);
  const btn = (label, fn) => { const b = el("button", null, label); b.addEventListener("click", (e) => { e.stopPropagation(); fn(); }); return b; };
  actions.append(btn("Forget", () => act("delete_history", { url: h.url }, true)));
  if (site) actions.append(btn("Forget " + site, () => act("delete_history", { query: site }, true)));
  r.append(icon(h.url), info, meta, actions);
  r.addEventListener("click", (e) => act("open_tab", { url: h.url, activate: !(e.metaKey || e.ctrlKey) }));
  return r;
}
function render() {
  const list = $("list"); list.replaceChildren();
  const q = $("q").value.trim();
  $("summary").textContent = items.length ? (q ? `${items.length}${items.length >= limit ? "+" : ""} matching` : `${items.length}${items.length >= limit ? "+" : ""} pages`) : "";
  if (!items.length) {
    const e = el("div", "empty"); e.append(el("b", null, q ? "Nothing matches" : "No history yet"), el("span", null, q ? "Try other words." : "Pages you visit show up here."));
    return list.append(e);
  }
  const key = { day: (h) => dayLabel(h.last_visit), site: (h) => host(h.url) || "Other", none: () => "" }[opts.group_by] || ((h) => dayLabel(h.last_visit));
  const groups = new Map();
  for (const h of items) { const g = key(h); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(h); }
  for (const [name, hs] of groups) {
    const g = el("section", "group");
    if (name) g.append(el("h2", null, name));
    for (const h of hs) g.append(row(h));
    list.append(g);
  }
  if (items.length >= limit) {
    const more = el("button", "more", "Show More");
    more.addEventListener("click", () => { limit += 500; load(); });
    list.append(more);
  }
}
async function load() {
  try { items = await valerie.call("search_history", { query: $("q").value.trim(), limit }); } catch (e) { valerie.log("error: search_history", e); }
  render();
}

$("q").addEventListener("input", () => { clearTimeout(timer); limit = 300; timer = setTimeout(load, 120); });
$("clear").addEventListener("click", () => $("head").classList.add("asking"));
$("no").addEventListener("click", () => $("head").classList.remove("asking"));
for (const b of document.querySelectorAll("[data-min]")) {
  b.addEventListener("click", () => { $("head").classList.remove("asking"); act("delete_history", { since_minutes: Number(b.dataset.min) }, true); });
}
addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "f") { e.preventDefault(); $("q").focus(); } });
valerie.on("history", load);
valerie.call("get_settings", { key: "history.page" }).then((s) => { Object.assign(opts, s.in_use || {}); render(); }).catch(() => {});
load();
</script>
</body>
</html>
