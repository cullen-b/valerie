<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Casino</title>
<meta name="valerie-tools" content="host_game stop_hosting game_frames hosting_status">
<style>
:root { --bg: var(--v-bg, #16151c); --fg: var(--v-fg, #ecebf5); }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); }
body { display: grid; justify-items: center; align-items: start; min-height: 100vh; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
main { width: min(640px, 100% - 32px); padding: 16px 0 32px; }
#casino { display: block; width: 100%; aspect-ratio: 210 / 148; image-rendering: pixelated; cursor: pointer; touch-action: manipulation; }
#casino:focus-visible { outline: 2px solid var(--fg); outline-offset: 6px; }
#casino-msg { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<main>
<canvas id="casino" tabindex="0" role="img" aria-label="Games: blackjack, poker, baccarat, roulette, slots, hearts, spades and bridge. Left and right arrows switch games, or pick a card during a card game; Space plays; the question mark in the corner shows how to play."></canvas>
<p id="casino-msg" role="status"></p>
</main>
</body>
</html>
