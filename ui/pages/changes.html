<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Change History</title>
<meta name="valerie-tools" content="list_changes go_back_to_change">
<style>
:root { --bg: var(--v-bg, #16151c); --fg: var(--v-fg, #ecebf5); --dim: var(--v-dim, rgba(236,235,245,.62)); --line: var(--v-line, rgba(255,255,255,.12));
  --card: var(--v-card, rgba(255,255,255,.045)); --accent: var(--v-accent, #9d8cff); --danger: #ff7a7a; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 760px; margin: 0 auto; padding: 44px 32px 80px; }
h1 { font-size: 26px; font-weight: 650; letter-spacing: -.01em; margin: 0 0 6px; }
.lead { color: var(--dim); margin: 0 0 30px; max-width: 62ch; text-wrap: pretty; }
button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 11px; cursor: default; touch-action: manipulation; }
button:hover { background: var(--card); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.go { border-color: color-mix(in srgb, var(--accent) 65%, transparent); }
h2 { font-size: 13px; font-weight: 600; color: var(--dim); margin: 26px 0 6px 30px; }
h2:first-child { margin-top: 0; }
ol { list-style: none; margin: 0; padding: 0; position: relative; }
/* The line through the changes is the page: each dot is a state you can return to. */
ol::before { content: ""; position: absolute; left: 7px; top: 14px; bottom: 14px; width: 2px; background: var(--line); }
li { position: relative; padding: 8px 10px 8px 30px; border-radius: 10px; content-visibility: auto; contain-intrinsic-size: auto 62px; }
li::before { content: ""; position: absolute; left: 3px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 2px solid var(--dim); }
li.now::before { background: var(--accent); border-color: var(--accent); }
li.went::before { border-color: var(--accent); }
.top { display: flex; align-items: baseline; gap: 12px; }
.what { flex: 1; min-width: 0; font-weight: 550; overflow-wrap: anywhere; }
.when { color: var(--dim); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.here { color: var(--accent); font-size: 12.5px; font-weight: 600; }
.more { display: flex; align-items: center; gap: 10px; min-height: 28px; margin-top: 2px; }
.more .files { border: none; color: var(--dim); font-size: 12.5px; padding: 2px 6px; margin-left: -6px; }
.more .files:hover { color: var(--fg); }
.more .plain { color: var(--dim); font-size: 12.5px; }
.back { margin-left: auto; opacity: 0; }
li:hover .back, li:focus-within .back { opacity: 1; }
@media (hover: none) { .back { opacity: 1; } }
.ask { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0 4px; padding: 10px 12px; background: var(--card); border-radius: 10px; }
.ask span { flex: 1 1 260px; }
ul { list-style: none; margin: 6px 0 2px; padding: 0; color: var(--dim); font-size: 12.5px; }
ul li { padding: 1px 0; overflow-wrap: anywhere; }
ul li::before { display: none; }
.flash:empty { display: none; }
.flash { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); max-width: min(560px, 90vw); padding: 8px 14px; border-radius: 10px;
  background: var(--fg); color: var(--bg); font-size: 13px; }
.flash.bad { background: var(--danger); color: #1a0505; }
.empty { color: var(--dim); padding: 70px 0; text-align: center; }
.empty b { display: block; color: var(--fg); font-size: 16px; font-weight: 600; margin-bottom: 4px; }
@media (max-width: 560px) { main { padding: 28px 16px 60px; } .top { flex-wrap: wrap; gap: 0 12px; } }
</style>
</head>
<body>
<main>
  <h1>Change History</h1>
  <p class="lead">Every change to your settings, look, plugins and layouts, whether you or an AI made it. Going back restores the files exactly and deletes nothing, so you can always return here.</p>
  <div id="list"></div>
</main>
<div id="flash" class="flash" role="status" aria-live="polite"></div>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let items = [], asking = null, lastAsked = null;
const open = new Set();

let flashTimer = 0;
function flash(text, bad) {
  const f = $("flash");
  f.textContent = text;
  f.className = bad ? "flash bad" : "flash";
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { f.textContent = ""; }, bad ? 7000 : 3500);
}

const dayOf = (at) => {
  const d = new Date(at * 1000), now = new Date();
  const days = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  if (days === 0) return "Today";
  if (days === 1) return "Yesterday";
  return d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: d.getFullYear() === now.getFullYear() ? undefined : "numeric" });
};
const timeOf = (at) => new Date(at * 1000).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
const fileWord = (n) => n === 1 ? "1 file" : n + " files";

async function goBack(c, button) {
  button.disabled = true;
  button.textContent = "Going back…";
  asking = null;
  try {
    await valerie.call("go_back_to_change", { id: c.id });
    flash("Went back to: " + c.why);
  } catch (e) {
    flash("Couldn't go back: " + e.message, true);
  }
  load();
}

function row(c, i) {
  const li = el("li", (i === 0 ? "now " : "") + (c.why.startsWith("Went back to:") ? "went" : ""));
  const top = el("div", "top");
  top.append(el("div", "what", c.why));
  if (i === 0) top.append(el("span", "here", "Now"));
  top.append(el("span", "when", timeOf(c.at)));
  li.append(top);
  const more = el("div", "more");
  if (c.changed.length) {
    const shown = open.has(c.id);
    const files = el("button", "files", (shown ? "Hide " : "Show ") + fileWord(c.changed.length));
    files.dataset.focus = "files:" + c.id;
    files.setAttribute("aria-expanded", String(shown));
    files.addEventListener("click", () => { shown ? open.delete(c.id) : open.add(c.id); render(); });
    more.append(files);
  } else if (i === items.length - 1) {
    more.append(el("span", "plain", "Where this history starts"));
  }
  if (i > 0 && asking !== c.id) {
    const back = el("button", "back", "Go back to this");
    back.dataset.focus = "back:" + c.id;
    back.addEventListener("click", () => { asking = c.id; render(); document.querySelector(".ask .go")?.focus(); });
    more.append(back);
  }
  li.append(more);
  if (asking === c.id) {
    const ask = el("div", "ask");
    ask.append(el("span", "", "Put your settings, plugins and looks back exactly as they were here? How things are now stays in this list."));
    const yes = el("button", "go", "Go back");
    yes.addEventListener("click", () => goBack(c, yes));
    const no = el("button", "", "Cancel");
    no.addEventListener("click", () => { asking = null; render(); });
    ask.append(yes, no);
    li.append(ask);
  }
  if (open.has(c.id)) {
    const ul = el("ul");
    for (const f of c.changed) ul.append(el("li", "", f.how[0].toUpperCase() + f.how.slice(1) + ": " + f.path));
    li.append(ul);
  }
  return li;
}

function render() {
  const list = $("list");
  // Drawing replaces every row: a keyboard user stays on the same button.
  const focused = document.activeElement?.dataset?.focus || (asking === null && lastAsked ? "back:" + lastAsked : null);
  lastAsked = asking;
  list.replaceChildren();
  if (!items.length) {
    const none = el("div", "empty");
    none.append(el("b", "", "No changes recorded yet"), "Change a setting or ask an AI to restyle Valerie, and it appears here.");
    list.append(none);
    return;
  }
  let day = null, ol = null;
  items.forEach((c, i) => {
    const d = dayOf(c.at);
    if (d !== day) {
      day = d;
      list.append(el("h2", "", d));
      ol = el("ol");
      list.append(ol);
    }
    ol.append(row(c, i));
  });
  if (focused) [...list.querySelectorAll("[data-focus]")].find((b) => b.dataset.focus === focused)?.focus();
}

async function load() {
  try {
    items = await valerie.call("list_changes", {});
    render();
  } catch (e) {
    flash("Couldn't read the history: " + e.message, true);
  }
}
valerie.on("changes", load);
load();
</script>
</body>
</html>
