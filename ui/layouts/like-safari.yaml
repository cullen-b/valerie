title: Like Safari
description: "Tabs, toolbar and bookmarks bar where Safari has them, for anyone coming from it. Pair it with shortcuts_like: safari."
settings:
  window: { traffic_lights: show }
  layout: { corner_radius: 0 }
window:
  gap: 0
  column:
    - panel: window-panels/browser-bar
      id: toolbar
      props: { style: safari }     # appearance: light | dark to stop following the computer
      size: 84
      radius: 0
    - panel: window-panels/browser-bar
      id: bookmarks             # the bookmarks bar: favorites, then pinned tabs and folders (⌘⇧B with shortcuts_like)
      props: { style: safari, role: bookmarks }
      size: 32
      radius: 0
      hidden: true
    - part: pages
      radius: 0
