<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root { --accent: #9d8cff; --bg: #1c1d29; --fg: #ecebf5; --dim: rgba(236,235,245,.5); --sel: rgba(255,255,255,.08); --line: rgba(255,255,255,.08); }
:root.light { --bg: #fbfaf8; --fg: #23201c; --dim: rgba(35,32,28,.5); --sel: rgba(0,0,0,.05); --line: rgba(0,0,0,.08); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: transparent; overflow: hidden; }
body { font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; color: var(--fg); -webkit-user-select: none; user-select: none; }
#backdrop { position: fixed; inset: 0; background: rgba(0,0,0,var(--dim, .22)); opacity: 0; transition: opacity .12s; }
#card {
  position: fixed; left: 50%; top: var(--top, 18vh); width: min(var(--width, 680px), calc(100vw - 48px)); transform: translateX(-50%) scale(.98);
  background: var(--bg); border-radius: 16px; overflow: hidden; opacity: 0; transition: opacity .12s, transform .12s;
  box-shadow: 0 0 0 1px var(--line), 0 24px 70px rgba(0,0,0,.45), 0 4px 16px rgba(0,0,0,.2);
}
body.open #backdrop { opacity: 1; }
body.open #card { opacity: 1; transform: translateX(-50%) scale(1); }
#inputrow { display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 58px; border-bottom: 1px solid var(--line); }
#inputrow .glyph { color: var(--accent); font-size: 18px; }
#scope { display: none; align-items: center; gap: 6px; padding: 4px 9px 4px 7px; border-radius: 8px; flex: none;
  background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--fg); font-size: 14px; font-weight: 600; }
#scope img { width: 16px; height: 16px; border-radius: 3px; }
body.scoped #scope { display: flex; }
body.scoped #inputrow .glyph { display: none; }
.item .tabkey { font-size: 11px; color: var(--dim); padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line); flex: none; }
input { flex: 1; background: none; border: 0; outline: none; color: var(--fg); font: inherit; font-size: var(--input-size, 19px); caret-color: var(--accent); }
input::placeholder { color: var(--dim); }
#list { max-height: min(430px, 55vh); overflow-y: auto; padding: 6px; }
#list:empty { display: none; }
#list::-webkit-scrollbar { width: 0; }
.item { display: flex; align-items: center; gap: 12px; height: calc(var(--input-size, 19px) * 2.2); padding: 0 12px; border-radius: 10px; }
.item.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
.item .ic { width: 18px; height: 18px; flex: none; display: grid; place-items: center; border-radius: 4px; font-size: 13px; color: var(--dim); }
.item img.ic { object-fit: contain; }
.item .txt { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.item .t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: none; max-width: 70%; }
.item .u { color: var(--dim); font-size: 12.5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.item .kind { font-size: 11px; color: var(--dim); padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line); flex: none; }
.item.sel .kind { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
mark { background: none; color: var(--accent); font-weight: 600; }
#foot { display: flex; gap: 16px; padding: 9px 18px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11.5px; }
kbd { font: 11px -apple-system, system-ui; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); margin-right: 4px; }
.section { font-size: 11px; color: var(--dim); padding: 8px 12px 4px; text-transform: uppercase; letter-spacing: .6px; }
</style>
</head>
<body>
<div id="backdrop"></div>
<div id="card">
  <div id="inputrow"><span class="glyph">⌕</span><span id="scope"></span><input id="q" spellcheck="false" autocomplete="off" placeholder="Search or enter URL…"></div>
  <div id="list"></div>
  <div id="foot"><span><kbd>↑↓</kbd>navigate</span><span><kbd>↵</kbd>open</span><span><kbd>⇧↵</kbd>open in new tab</span><span><kbd>esc</kbd>close</span></div>
</div>
<script>
const send = (o) => window.ipc.postMessage(JSON.stringify(o));
const q = document.getElementById("q"), list = document.getElementById("list");
let D = { items: [] }, results = [], sel = 0;
const badIcons = new Set(); // favicons that failed: draw the placeholder instead of retrying on every keystroke

function host(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function looksLikeUrl(s) { return /^[a-z]+:\/\//i.test(s) || /^localhost(:\d+)?/.test(s) || (!/\s/.test(s) && /^[^.\s]+(\.[^.\s]+)*\.[a-z0-9]{2,}(:\d+)?(\/.*)?$/i.test(s)); }

// Subsequence fuzzy score: rewards consecutive matches and word starts; returns -1 for no match.
function score(needle, hay) {
  if (!needle) return 0;
  hay = hay.toLowerCase();
  const direct = hay.indexOf(needle);
  if (direct >= 0) return 100 - Math.min(direct, 40) + (direct === 0 || /[\s/.\-_]/.test(hay[direct - 1]) ? 30 : 0);
  let s = 0, hi = 0, run = 0;
  for (const c of needle) {
    const i = hay.indexOf(c, hi); if (i < 0) return -1;
    run = i === hi ? run + 1 : 0; s += 1 + run * 2 + (i === 0 || /[\s/.\-_]/.test(hay[i - 1]) ? 3 : 0); hi = i + 1;
  }
  return s;
}
function highlight(text, needle) {
  if (!needle) return esc(text);
  const i = text.toLowerCase().indexOf(needle);
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + needle.length)) + "</mark>" + esc(text.slice(i + needle.length));
}
const KIND_WEIGHT = { plugin: 20, customize: 1, password: 3, agent: 2, tab: 30, command: 18, space: 18, favorite: 26, pinned: 26, bookmark: 12, history: 8, synced: 6, archived: 4, download: 10, chat: 16, setup: 6, ai: 15, watch: 5, task: 17, theme: 5, import: 5 };
const KIND_LABEL = { site: "Tab ⇥", plugin: "Plugin", customize: "Customize", password: "Copy Password", agent: "Agent", tab: "Switch to Tab", favorite: "Favorite", pinned: "Pinned", command: "Command", space: "Space", bookmark: "Bookmark", history: "History", synced: "Synced", archived: "Archived", download: "Download", calc: "Copy", chat: "Chat", setup: "Set Up", ai: "AI", watch: "Watching", task: "Task", theme: "Theme", import: "Import" };

// ---------- site search: type "youtube", press Tab, search YouTube ----------
let scope = null;
function siteFor(text) {
  const t = text.trim().toLowerCase();
  if (!t || !D.sites || !D.sites.length) return null;
  return D.sites.find((s) => s.keywords.some((k) => k.toLowerCase() === t))
    || (t.length >= 2 ? D.sites.find((s) => s.name.toLowerCase().startsWith(t)) : null);
}
function siteIcon(site) { try { return new URL("/favicon.ico", site.url.replace("%s", "")).href; } catch { return null; } }
function enterScope(site) {
  scope = site;
  const chip = document.getElementById("scope"); chip.textContent = "";
  const icon = siteIcon(site);
  if (icon) { const img = document.createElement("img"); img.src = icon; img.onerror = () => img.remove(); chip.append(img); }
  chip.append(document.createTextNode(site.name));
  document.body.classList.add("scoped");
  q.value = ""; q.placeholder = "Search " + site.name + "…";
  compute();
}
function leaveScope() {
  scope = null; document.body.classList.remove("scoped");
  q.placeholder = D.mode === "current" ? "Edit URL or search…" : "Search or enter URL…";
  compute();
}

// ---------- calculator: "12*(3+4)", "15% of 80", "5 km in mi", "70 f to c" ----------
const UNITS = {
  length: { mm: .001, cm: .01, m: 1, meter: 1, metre: 1, km: 1000, in: .0254, inch: .0254, ft: .3048, foot: .3048, feet: .3048,
            yd: .9144, yard: .9144, mi: 1609.344, mile: 1609.344, nmi: 1852 },
  mass: { mg: 1e-6, g: .001, gram: .001, kg: 1, kilo: 1, t: 1000, ton: 1000, tonne: 1000, oz: .028349523125, ounce: .028349523125,
          lb: .45359237, lbs: .45359237, pound: .45359237, st: 6.35029318, stone: 6.35029318 },
  volume: { ml: .001, cl: .01, dl: .1, l: 1, liter: 1, litre: 1, gal: 3.785411784, gallon: 3.785411784, qt: .946352946, quart: .946352946,
            pt: .473176473, pint: .473176473, cup: .2365882365, floz: .0295735295625, tbsp: .01478676478, tsp: .00492892159 },
  speed: { "m/s": 1, mps: 1, kph: 1 / 3.6, kmh: 1 / 3.6, "km/h": 1 / 3.6, mph: .44704, knot: .514444, kn: .514444 },
  data: { b: 1, byte: 1, kb: 1e3, mb: 1e6, gb: 1e9, tb: 1e12, pb: 1e15, kib: 1024, mib: 1024 ** 2, gib: 1024 ** 3, tib: 1024 ** 4 },
  time: { ms: .001, s: 1, sec: 1, second: 1, min: 60, minute: 60, h: 3600, hr: 3600, hour: 3600, day: 86400, d: 86400, week: 604800, wk: 604800,
          month: 2629800, year: 31557600, yr: 31557600 },
  temp: { c: "c", "°c": "c", celsius: "c", f: "f", "°f": "f", fahrenheit: "f", k: "k", kelvin: "k" },
};
function unit(name) {
  const n = name.toLowerCase();
  for (const [dim, table] of Object.entries(UNITS)) for (const key of [n, n.replace(/e?s$/, "")]) if (key in table) return { dim, v: table[key] };
  return null;
}
function convert(x, from, to) {
  const a = unit(from), b = unit(to);
  if (!a || !b || a.dim !== b.dim) return null;
  if (a.dim !== "temp") return x * a.v / b.v;
  const c = a.v === "c" ? x : a.v === "f" ? (x - 32) * 5 / 9 : x - 273.15;
  return b.v === "c" ? c : b.v === "f" ? c * 9 / 5 + 32 : c + 273.15;
}
function evaluate(src) {
  const s = src.replace(/[×x]/g, "*").replace(/÷/g, "/").replace(/(\d),(?=\d{3}\b)/g, "$1").replace(/\s+/g, "");
  let i = 0;
  const peek = () => s[i], eat = (c) => (s[i] === c ? (i++, true) : false);
  const num = () => { const m = /^\d*\.?\d+(e[+-]?\d+)?/i.exec(s.slice(i)); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]); };
  const prim = () => { if (eat("(")) { const v = expr(); if (!eat(")")) throw 0; return v; } return num(); };
  const unary = () => (eat("-") ? -unary() : eat("+") ? unary() : prim());
  const pow = () => { const b = unary(); return eat("^") ? b ** pow() : b; };
  const term = () => { let v = pow(); for (;;) { if (eat("*")) v *= pow(); else if (eat("/")) v /= pow(); else return v; } };
  const expr = () => { let v = term(); for (;;) { if (eat("+")) v += term(); else if (eat("-")) v -= term(); else return v; } };
  const v = expr();
  if (i !== s.length || !isFinite(v)) throw 0;
  return v;
}
function calc(raw) {
  if (!(D.options && D.options.calculator !== false)) return null;
  const s = raw.trim().replace(/^=\s*/, "");
  const fmt = (v) => (Math.abs(v) >= 1e15 || (v !== 0 && Math.abs(v) < 1e-6) ? v.toExponential(6) : String(+v.toFixed(10)).replace(/(\.\d{0,8})\d*/, "$1"));
  let m = s.match(/^(-?[\d.,]+)\s*%\s*of\s+(-?[\d.,]+)$/i);
  if (m) { const v = parseFloat(m[1].replace(/,/g, "")) / 100 * parseFloat(m[2].replace(/,/g, "")); return { title: fmt(v), sub: s }; }
  m = s.match(/^(-?[\d.,]+)\s*([a-z°µ/]+(?:\s?[a-z]+)?)\s+(?:in|to|as|=)\s+([a-z°µ/]+)$/i);
  if (m) { const v = convert(parseFloat(m[1].replace(/,/g, "")), m[2].replace(/\s/g, ""), m[3]); return v == null ? null : { title: fmt(+v.toPrecision(6)) + " " + m[3], sub: s }; }
  if (!/^[\d\s.,+\-*/^()×x÷]+$/.test(s) || !/\d\s*[+\-*/^×x÷]|\)\s*[+\-*/^×x÷(]/.test(s)) return null;
  try { return { title: fmt(evaluate(s)), sub: s }; } catch (_) { return null; }
}

// Questions and requests ("what's in my tabs?", "merge these PRs once checks pass") rather than searches.
const ASKY = /^(what|why|how|who|when|where|which|is|are|can|could|does|do|should|would|will|explain|summari[sz]e|compare|find|merge|close|open|book|buy|order|check|watch|remind|organi[sz]e|tidy|draft|write|reply|fill|sign|tell|show|list|help)\b/i;
function wantsAgent(raw) {
  const o = D.options || {}, n = o.ask_agent_words ?? 6;
  const t = raw.trim(), words = t.split(/\s+/).length;
  // Starting with a word like "summarize" or "create" means an agent, however short.
  const first = t.split(/\s+/)[0].toLowerCase().replace(/[^a-z']/g, "");
  if (words >= 2 && (o.ask_agent_starts || []).some((w) => w.toLowerCase() === first)) return true;
  if (n <= 0) return false;
  return (t.endsWith("?") && words >= Math.max(3, n - 2)) || (words >= n && ASKY.test(t)) || words >= n * 2;
}

function compute() {
  const raw = q.value.trim(), needle = raw.toLowerCase();
  let out = [];
  if (D.mode === "prompt") { results = []; sel = 0; return draw(); }
  // A plugin's list: only its items, filtered by what's typed.
  if (D.mode === "list") {
    results = D.items.map((it) => ({ ...it, s: needle ? Math.max(score(needle, it.title || ""), score(needle, it.sub || "") - 5) : 0 }))
      .filter((it) => it.s >= 0).sort((a, b) => b.s - a.s);
    sel = 0; return draw();
  }
  askPlugins(raw);
  if (scope) {
    results = raw ? [{ kind: "go", title: raw, sub: "Search " + scope.name, go: scope.url.replace("%s", encodeURIComponent(raw)), icon: "⌕" }] : [];
    sel = 0; return draw();
  }
  // "! change" asks the user's AI assistant to change Valerie itself.
  if (raw.startsWith("!")) {
    const req = raw.slice(1).trim();
    results = [{ kind: "customize", title: req ? "Customize Valerie: " + req : "Describe how Valerie should change…", sub: D.agent, icon: "✎",
                 cmd: req ? { cmd: "customize", request: req } : null }];
    sel = 0; return draw();
  }
  // "> task" or "? question" goes straight to an agent in Chats (it can see and use the whole browser).
  if (raw.startsWith(">") || raw.startsWith("?")) {
    const task = raw.slice(1).trim();
    results = [{ kind: "agent", title: task ? "Ask " + D.agent + ": " + task : "Ask " + D.agent + " anything, or to do something…", sub: "Opens in Chats", icon: "✦",
                 cmd: task ? { cmd: "new_chat", prompt: task } : null }];
    sel = 0; return draw();
  }
  const answer = raw && calc(raw);
  if (answer) {
    results = [{ kind: "calc", title: "= " + answer.title, sub: answer.sub, icon: "=", cmd: { cmd: "copy_text", text: answer.title.split(" ")[0] } }];
    sel = 0; return draw();
  }
  if (raw) {
    const url = looksLikeUrl(raw);
    out.push({ kind: "go", title: url ? raw : raw, sub: url ? "Open" : "Search " + D.engine, go: raw, icon: url ? "↗" : "⌕" });
  }
  const seen = new Set();
  for (const it of D.items) {
    const s = needle ? Math.max(score(needle, it.title || ""), score(needle, it.url || "") - 5) : (it.rank != null && it.rank < 8 ? 50 - it.rank : -1);
    if (s < 0) continue;
    if (it.url && it.kind !== "tab" && it.kind !== "favorite" && it.kind !== "pinned") { if (seen.has(it.url)) continue; seen.add(it.url); }
    const boost = it.kind === "history" ? Math.min(Math.log2((it.visits || 1) + 1) * 3, 15) : 0;
    out.push({ ...it, s: s + (((D.options || {}).result_weights || KIND_WEIGHT)[it.kind] ?? KIND_WEIGHT[it.kind] ?? 0) + boost });
  }
  const head = out[0] && out[0].kind === "go" ? [out.shift()] : [];
  out.sort((a, b) => b.s - a.s);
  // What you typed comes first; with top_result: best_match a strong title/host match goes above it instead.
  const bestFirst = (D.options || {}).top_result === "best_match";
  if (bestFirst && head.length && out[0] && out[0].s > 120 && D.mode !== "current") out.splice(1, 0, ...head); else out = head.concat(out);
  results = out.slice(0, raw ? Math.max(1, ((D.options || {}).max_results || 60) - 1) : 8);
  const site = siteFor(raw);
  if (site) results.splice(bestFirst || !head.length ? 0 : 1, 0, { kind: "site", title: "Search " + site.name, sub: "", site, favicon: siteIcon(site) });
  if (raw && !looksLikeUrl(raw)) {
    // Something that reads like a question or a request goes to the top: Enter asks the agent.
    const ask = { kind: "agent", title: "Ask " + D.agent + ": " + raw, sub: "Opens in Chats · can use your browser", icon: "✦", cmd: { cmd: "new_chat", prompt: raw } };
    if (wantsAgent(raw)) results.unshift(ask); else results.push(ask);
    results.push({ kind: "customize", title: "Customize Valerie: " + raw, sub: D.agent, icon: "✎", cmd: { cmd: "customize", request: raw } });
  }
  // Results plugins sent for this text go just under what you typed (they arrive a moment after typing).
  const fromPlugins = Object.values(extra).filter((m) => m.query === raw).flatMap((m) => m.items.slice(0, 8));
  if (fromPlugins.length) results.splice(results.findIndex((r) => r.kind === "go") + 1, 0, ...fromPlugins);
  sel = 0; draw();
}

// ---------- plugins' search providers: asked a moment after you stop typing; their results join the list ----------
let extra = {}, searchTimer = 0;
function askPlugins(raw) {
  clearTimeout(searchTimer);
  if (!D.plugin_search || raw.length < 2 || /^[!>?]/.test(raw)) { extra = {}; return; }
  for (const k of Object.keys(extra)) if (extra[k].query !== raw) delete extra[k];
  searchTimer = setTimeout(() => send({ t: "search", query: raw }), 160);
}
function more(query, plugin, title, items) {
  if (query !== q.value.trim() || D.mode === "prompt" || D.mode === "list") return;
  extra[plugin + "/" + title] = { query, items: items.map((it) => ({ ...it, sub: it.sub && it.sub !== plugin ? it.sub : title })) };
  const keep = results[sel];
  compute();
  const i = keep ? results.findIndex((r) => r.title === keep.title && r.kind === keep.kind) : -1;
  if (i > 0) { sel = i; mark(); }
}

function draw() {
  const needle = q.value.trim().toLowerCase();
  list.innerHTML = "";
  if (!results.length) {
    if (D.options && D.options.empty_hint) list.innerHTML = '<div class="section">Type to search tabs, history, bookmarks and commands</div>';
    return;
  }
  results.forEach((r, i) => {
    const d = document.createElement("div"); d.className = "item" + (i === sel ? " sel" : "");
    let ic;
    const src = r.favicon || (r.url && /^https?:/.test(r.url) && r.kind !== "go" ? new URL("/favicon.ico", r.url).href : null);
    if (src && !badIcons.has(src)) {
      ic = document.createElement("img"); ic.className = "ic"; ic.src = src;
      ic.onerror = () => { badIcons.add(src); const s = document.createElement("div"); s.className = "ic"; s.textContent = "◦"; ic.replaceWith(s); };
    } else if (src) { ic = document.createElement("div"); ic.className = "ic"; ic.textContent = "◦"; }
    else { ic = document.createElement("div"); ic.className = "ic"; ic.textContent = r.icon || (r.kind === "command" ? "⌘" : r.kind === "space" ? "◆" : "◦"); }
    const txt = document.createElement("div"); txt.className = "txt";
    const sub = r.kind === "go" ? r.sub : r.sub || (r.url ? host(r.url) || r.url : "");
    txt.innerHTML = '<span class="t">' + highlight(r.title || r.url || "", needle) + '</span><span class="u">' + esc(sub) + "</span>";
    d.append(ic, txt);
    if (r.kind !== "go") { const k = document.createElement("span"); k.className = "kind"; k.textContent = KIND_LABEL[r.kind] || r.kind; d.append(k); }
    d.onmousemove = () => { if (sel !== i) { sel = i; mark(); } };
    d.onclick = (e) => choose(r, e.shiftKey);
    list.append(d);
  });
}
function mark() { [...list.children].forEach((c, i) => c.classList.toggle("sel", i === sel)); list.children[sel]?.scrollIntoView({ block: "nearest" }); }

function choose(r, newTab) {
  if (!r) return;
  const nt = D.mode === "current" ? !!newTab : true;
  let c;
  if ((r.kind === "agent" || r.kind === "customize") && !r.cmd) return;
  if (r.kind === "site") return enterScope(r.site);
  if (r.kind === "go") c = { cmd: "go", input: r.go, new_tab: nt };
  else if (r.cmd) c = r.cmd;
  else if (r.tab != null) c = { cmd: "activate_tab", tab: r.tab };
  else if (r.url) c = { cmd: "go", input: r.url, new_tab: nt };
  if (c) send({ t: "cmd", cmd: c });
}
function close() { send({ t: "cmd", cmd: { cmd: "close_command_bar" } }); }

q.addEventListener("input", compute);
q.addEventListener("keydown", (e) => {
  const k = e.key, ctl = e.ctrlKey;
  if (k === "Tab" && !e.shiftKey && !scope) {
    const site = siteFor(q.value);
    if (site) { e.preventDefault(); return enterScope(site); }
  }
  if (k === "Backspace" && scope && !q.value) { e.preventDefault(); return leaveScope(); }
  if (k === "ArrowDown" || (ctl && (k === "n" || k === "j")) || (k === "Tab" && !e.shiftKey)) { e.preventDefault(); sel = Math.min(sel + 1, results.length - 1); mark(); }
  else if (k === "ArrowUp" || (ctl && (k === "p" || k === "k")) || (k === "Tab" && e.shiftKey)) { e.preventDefault(); sel = Math.max(sel - 1, 0); mark(); }
  else if (k === "Enter" && D.mode === "prompt") {
    e.preventDefault();
    const v = q.value.trim();
    if (v) send({ t: "cmd", cmd: Object.assign({}, D.prompt.then, { [D.prompt.field]: v }) });
  }
  else if (k === "Enter") { e.preventDefault(); choose(results[sel], e.shiftKey); }
  else if (k === "Escape") { e.preventDefault(); close(); }
});
document.getElementById("backdrop").onmousedown = close;

window.palette = {
  more,
  open(data) {
    D = data; extra = {};
    const r = document.documentElement;
    r.classList.toggle("light", data.theme.mode === "light");
    r.style.setProperty("--accent", data.theme.accent);
    if (data.theme.mode !== "light") r.style.setProperty("--bg", "color-mix(in srgb, " + data.theme.background[0] + " 70%, #101014)");
    else r.style.removeProperty("--bg");
    document.getElementById("foot").style.display = data.options && data.options.footer_hints === false ? "none" : "";
    const o = data.options || {};
    if (o.width) r.style.setProperty("--width", o.width + "px");
    if (o.top != null) r.style.setProperty("--top", o.top + "vh");
    if (o.font_size) r.style.setProperty("--input-size", o.font_size + "px");
    if (o.dim_background != null) r.style.setProperty("--dim", o.dim_background);
    document.body.style.fontFamily = data.font ? `${data.font}, -apple-system, system-ui, sans-serif` : "";
    q.placeholder = data.mode === "current" ? "Edit URL or search…" : "Search or enter URL…";
    q.value = data.mode === "prompt" ? data.prompt.value || "" : data.query || "";
    if (data.mode === "prompt") q.placeholder = data.prompt.label + "…";
    if (data.mode === "list") { q.value = ""; q.placeholder = data.placeholder || "Pick one…"; }
    document.querySelector("#inputrow .glyph").textContent = data.mode === "prompt" ? "✎" : "⌕";
    scope = null; document.body.classList.remove("scoped");
    compute();
    document.body.classList.add("open");
    setTimeout(() => { q.focus(); q.select(); }, 0);
  },
  hide() { document.body.classList.remove("open"); },
};
send({ t: "ready" });
</script>
