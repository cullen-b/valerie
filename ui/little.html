<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root { --bg1: #171a2b; --bg2: #2a1f3d; --accent: #9d8cff; --fg: #ecebf5; --dim: rgba(236,235,245,.55); --hover: rgba(255,255,255,.08); }
:root.light { --fg: #23201c; --dim: rgba(35,32,28,.5); --hover: rgba(0,0,0,.06); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; overflow: hidden; }
body { height: 36px; overflow: hidden; }
body {
  font: 12.5px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: var(--fg); -webkit-user-select: none; user-select: none;
  background: linear-gradient(90deg, var(--bg1), var(--bg2)); display: flex; align-items: center; gap: 8px; padding: 0 8px 0 78px;
}
#title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--dim); }
#title b { color: var(--fg); font-weight: 500; margin-right: 6px; }
.btn { height: 24px; padding: 0 9px; border-radius: 7px; display: flex; align-items: center; gap: 5px; color: var(--dim); }
.btn:hover { background: var(--hover); color: var(--fg); }
#open { background: var(--accent); color: #fff; font-weight: 500; }
#open:hover { filter: brightness(1.08); background: var(--accent); color: #fff; }
.split { display: flex; }
.split.picker #open { border-radius: 7px 0 0 7px; }
#pick { display: none; background: var(--accent); color: #fff; border-radius: 0 7px 7px 0; padding: 0 8px; margin-left: 1px; font-size: 13px; }
.split.picker #pick { display: flex; }
#pick:hover { filter: brightness(1.12); background: var(--accent); color: #fff; }
#addr { display: none; flex: 1; min-width: 0; height: 24px; padding: 0 10px; border: 0; outline: 0; border-radius: 7px; background: var(--hover);
  color: var(--fg); font: inherit; -webkit-user-select: text; user-select: text; }
#addr::placeholder { color: var(--dim); }
#addr:focus { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent); }
#priv { display: none; height: 20px; padding: 0 8px; border-radius: 10px; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
  color: #e9e4ff; background: rgba(255,255,255,.1); white-space: nowrap; }
#priv svg { width: 12px; height: 12px; }
body.private { background: linear-gradient(90deg, #1b1a21, #25222e); --fg: #ecebf5; --dim: rgba(236,235,245,.55); --hover: rgba(255,255,255,.08); }
body.private #priv { display: flex; }
body.private #split { display: none; }
/* little_window.top_bar: hover: the bar's contents fade in as the window's top glides up to show it */
body.rise > * { animation: rise .28s cubic-bezier(.22,1,.36,1); }
@keyframes rise { from { transform: translateY(5px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { body.rise > * { animation: none; } }
/* little_window.top_bar: fade: the window's top jumps up and the whole bar fades in quickly instead */
html.fade body.rise { animation: fadein .15s ease-out; } html.fade body.rise > * { animation: none; }
@keyframes fadein { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { html.fade body.rise { animation: none; } }
body.ask #addr { display: block; } body.ask #title, body.ask #back, body.ask #copy, body.ask #split { display: none; }
/* little_window.tabs: with two or more tabs, they take the title's place */
#tabs { display: none; flex: 1; min-width: 0; gap: 2px; align-items: center; overflow: hidden; }
body.tabs #tabs { display: flex; } body.tabs #title { display: none; }
body.tabs.ask #tabs { flex: 0 1 auto; max-width: 45%; }
.tab { flex: 0 1 168px; min-width: 44px; height: 24px; padding: 0 3px 0 9px; border-radius: 7px; display: flex; align-items: center; gap: 2px;
  color: var(--dim); transition: background-color .15s, color .15s; }
.tab span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tab:hover { color: var(--fg); }
.tab.on { background: var(--hover); color: var(--fg); }
.tab .x { flex: none; width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font-size: 14px; line-height: 1; opacity: 0; }
.tab:hover .x, .tab.on .x { opacity: .7; }
.tab .x:hover { opacity: 1; background: var(--hover); }
@media (prefers-reduced-motion: reduce) { .tab { transition: none; } }
</style>
</head>
<body>
<div class="btn" id="back">‹</div>
<div id="priv" title="Cookies and site data here are forgotten when this window closes, and nothing goes in your history"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 9.5c2.5-1.2 9.5-1.2 12 0"/><path d="M4 9l1.2-5h5.6L12 9"/><circle cx="5" cy="12" r="1.8"/><circle cx="11" cy="12" r="1.8"/><path d="M6.8 12h2.4"/></svg>Private</div>
<div id="title"></div>
<div id="tabs" role="tablist"></div>
<input id="addr" placeholder="Search or enter address" spellcheck="false" autocomplete="off">
<div class="btn" id="copy" title="Copy URL (⌘⇧C)">Copy link</div>
<div class="split" id="split"><div class="btn" id="open" title="⌘O">Open in Valerie</div><div class="btn" id="pick" title="Open in another space">▾</div></div>
<script>
if (!/Mac/.test(navigator.platform)) { document.getElementById("copy").title = "Copy URL (Ctrl+Shift+C)"; document.getElementById("open").title = "Ctrl+O"; }
const send = (o) => window.ipc.postMessage(JSON.stringify(o));
const cmd = (c) => send({ t: "cmd", cmd: c });
document.getElementById("open").onclick = () => cmd({ cmd: "move_to_main_window" });
document.getElementById("pick").onclick = (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  send({ t: "space_menu", x: r.right - 150, y: r.bottom + 4 });
};
document.getElementById("copy").onclick = () => cmd({ cmd: "copy_url" });
document.getElementById("back").onclick = () => cmd({ cmd: "back" });
// A new empty little window asks where to go: Enter goes there, Esc closes it.
const addr = document.getElementById("addr");
addr.onkeydown = (e) => {
  if (e.isComposing || e.keyCode === 229) return; // an input method's own Enter or Esc
  if (e.key === "Enter" && addr.value.trim()) send({ t: "go", text: addr.value });
  else if (e.key === "Escape") cmd({ cmd: "close_tab" });
};
document.body.onmousedown = (e) => { if ((e.target === document.body || e.target.id === "title" || e.target.id === "tabs") && e.button === 0) send(e.detail === 2 ? { t: "title_double_click" } : { t: "drag" }); };
// Leaving through the top or sides puts the bar away (the page below handles the mouse moving down onto it).
document.documentElement.addEventListener("mouseleave", (e) => {
  if (e.clientY < document.body.offsetHeight - 2 && !document.body.classList.contains("ask")) send({ t: "bar_away" });
});
// ⌘T (Ctrl+T elsewhere) here opens a tab too, while keybindings leaves the key free (tabKey).
let tabKey = false, lastPage;
addEventListener("keydown", (e) => {
  if (!tabKey || e.code !== "KeyT" || e.shiftKey || e.altKey) return;
  if (!(/Mac/.test(navigator.platform) ? e.metaKey && !e.ctrlKey : e.ctrlKey && !e.metaKey)) return;
  e.preventDefault(); cmd({ cmd: "new_tab" });
});
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
function drawTabs(tabs) {
  const box = document.getElementById("tabs");
  box.replaceChildren(...tabs.map((t) => {
    const el = document.createElement("div"); el.className = "tab" + (t.active ? " on" : ""); el.setAttribute("role", "tab");
    el.setAttribute("aria-selected", t.active ? "true" : "false");
    const label = document.createElement("span"); label.textContent = t.title || host(t.url) || "New tab"; el.title = label.textContent;
    const x = document.createElement("div"); x.className = "x"; x.textContent = "×"; x.title = "Close tab"; x.setAttribute("aria-label", "Close " + label.textContent);
    x.onclick = (e) => { e.stopPropagation(); send({ t: "close_tab", n: t.n }); };
    el.onmousedown = (e) => { if (e.button === 1) { e.preventDefault(); send({ t: "close_tab", n: t.n }); } };
    el.onclick = () => { if (!t.active) send({ t: "show_tab", n: t.n }); };
    el.append(label, x); return el;
  }));
  document.body.classList.toggle("tabs", tabs.length > 1);
}
window.little = {
  reveal() { const b = document.body; b.classList.remove("rise"); void b.offsetWidth; b.classList.add("rise"); },
  render(s) {
    const r = document.documentElement;
    r.classList.toggle("light", s.theme.mode === "light");
    r.classList.toggle("fade", !!s.fade);
    r.style.setProperty("--bg1", s.theme.background[0]);
    r.style.setProperty("--bg2", s.theme.background[1] || s.theme.background[0]);
    r.style.setProperty("--accent", s.theme.accent);
    document.body.style.fontFamily = s.font ? `${s.font}, -apple-system, system-ui, sans-serif` : "";
    let h = ""; try { h = new URL(s.url).hostname.replace(/^www\./, ""); } catch {}
    const t = document.getElementById("title"); t.innerHTML = "";
    const b = document.createElement("b"); b.textContent = h; t.append(b, document.createTextNode(s.title || ""));
    document.getElementById("open").textContent = "Open in " + (s.space || "Valerie");
    document.getElementById("split").classList.toggle("picker", !!s.picker);
    document.body.classList.toggle("private", !!s.private);
    document.getElementById("copy").style.display = s.copy_button ? "" : "none";
    tabKey = !!s.tab_key;
    drawTabs(s.tabs || []);
    // A new ask (or another empty tab) starts with a clear, focused address box.
    const page = ((s.tabs || []).find((t) => t.active) || {}).n;
    const asking = !!s.ask && (!document.body.classList.contains("ask") || page !== lastPage);
    lastPage = page;
    // Done asking with the mouse already gone from the bar: nothing else would put it away.
    if (!s.ask && document.body.classList.contains("ask") && !document.documentElement.matches(":hover")) send({ t: "bar_away" });
    document.body.classList.toggle("ask", !!s.ask);
    if (asking) { addr.value = ""; addr.focus(); }
  },
};
send({ t: "ready" });
</script>
</body>
</html>
