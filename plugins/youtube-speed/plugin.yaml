# YouTube speed control: change playback speed from the keyboard, like the "YouTube Playback Speed Control"
# extension. Turn it off with enabled: false; tune it with the settings below.
description: Speed videos up and down with + and -, reset with *, Shift+scroll over the video, and a speed badge.
enabled: true

# Sites this runs on. Add hosts (or use [] for every site) to control any HTML5 video.
matches: ["youtube.com", "youtube-nocookie.com"]

settings:
  faster_key: "+"          # speed up (the unshifted "=" key works too)
  slower_key: "-"          # slow down
  reset_key: "*"           # back to normal speed (1×)
  step: 0.25               # how much each press changes the speed
  min_speed: 0.25
  max_speed: 16            # most browsers mute the sound above about 4×
  remember: true           # keep your speed for the next video
  display: hover           # speed badge on the video. one of: hover | always | flash (only when it changes) | never
  shift_scroll: true       # Shift + scroll over the video changes the speed
  preserve_pitch: true     # keep voices at normal pitch when sped up; if the sound drops out at some speeds, try false

commands:
  - title: "Video: faster"
    js: "return window.__valerieSpeed ? __valerieSpeed.change(1) : 'No video on this page'"
  - title: "Video: slower"
    js: "return window.__valerieSpeed ? __valerieSpeed.change(-1) : 'No video on this page'"
  - title: "Video: normal speed"
    js: "return window.__valerieSpeed ? __valerieSpeed.reset() : 'No video on this page'"
