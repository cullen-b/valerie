<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Outline</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--v-bg); color: var(--v-fg); font: 13px/1.35 system-ui, sans-serif; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; cursor: default; }
  h1 { margin: 0; padding: 14px 14px 8px; color: var(--v-dim); font: 600 11px/1 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
  #list { flex: 1; min-height: 0; overflow: auto; padding: 0 6px 12px; }
  button { display: block; width: 100%; padding: 5px 8px; border: 0; border-radius: 6px; background: transparent; color: inherit; font: inherit; text-align: left; overflow-wrap: anywhere; }
  button:hover { background: var(--v-card); }
  button:focus-visible { outline: 2px solid var(--v-accent); outline-offset: -2px; }
  .l2 { padding-left: 18px; color: var(--v-dim); }
  .l3 { padding-left: 30px; color: var(--v-dim); font-size: 12px; }
  #none { padding: 6px 8px; color: var(--v-dim); }
</style>
</head>
<body>
<h1>On this page</h1>
<div id="list"></div>
<script>
  const list = document.getElementById("list");
  const SCRIPT = "return [...document.querySelectorAll('h1,h2,h3')].filter(h => h.offsetParent && h.textContent.trim()).slice(0, 200).map((h, i) => { h.dataset.valerieOutline = i; return { i, level: +h.tagName[1], text: h.textContent.trim().slice(0, 120) }; })";
  let shown = "";
  function say(text) {
    const p = document.createElement("div");
    p.id = "none";
    p.textContent = text;
    list.replaceChildren(p);
  }
  async function refresh() {
    const s = valerie.state;
    const place = s && s.active != null ? s.active + " " + s.url : "";
    if (!s || s.active == null) { shown = place; return say("Nothing open."); }
    let heads = [];
    try { heads = await valerie.call("eval_js", { script: SCRIPT, tab: s.active }); } catch (e) { valerie.log("couldn't read headings", e); }
    shown = place;
    if (!Array.isArray(heads) || !heads.length) return say("No headings on this page.");
    list.replaceChildren(...heads.map((h) => {
      const b = document.createElement("button");
      b.className = "l" + h.level;
      b.textContent = h.text;
      b.addEventListener("click", () => valerie.call("eval_js", { tab: s.active, script: "const h = document.querySelector('[data-valerie-outline=\"" + Number(h.i) + "\"]'); if (h) h.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); return true" }));
      return b;
    }));
  }
  let settle = 0, wasLoading = false;
  valerie.on("state", () => {
    const s = valerie.state;
    const place = s && s.active != null ? s.active + " " + s.url : "";
    const tab = s && [...(s.today || [])].find((t) => t.id === s.active);
    const loading = !!(tab && tab.loading);
    if (place !== shown || (wasLoading && !loading)) { clearTimeout(settle); settle = setTimeout(refresh, 500); }
    wasLoading = loading;
  });
  refresh();
</script>
</body>
</html>
